/* Light on Light — design tokens
 * Hallmark · route: custom (tuned) · vibe: "warm fog, emerging trace, breathing"
 * axes: light / roman-serif / chromatic-amber ~65°
 * Every colour and font below references a token from this block.
 */

:root {
  /* ---------- Colour · warm fog paper, amber signal ---------- */
  /* Paper is never pure white; every neutral carries chroma toward hue ~68. */
  --color-paper:       oklch(96.5% 0.008 72);   /* 暖雾白 — the page */
  --color-paper-2:     oklch(94%   0.010 70);   /* 雾略沉一层 */
  --color-paper-3:     oklch(90.5% 0.012 68);   /* 雾最浓处 — the thought */

  --color-ink:         oklch(21%   0.012 66);   /* 近黑暖褐 — text, and the entry surface */
  --color-ink-2:       oklch(38%   0.011 64);   /* 次级文字 · 铅笔痕 */
  --color-neutral:     oklch(46%   0.010 66);
  --color-muted:       oklch(52.5% 0.010 66);   /* 弱化文字 — measured 4.92:1 on paper,
                                                 * clears WCAG AA at the 12.8px micro size */

  --color-rule:        oklch(82%   0.010 70);   /* 发丝线 */
  --color-rule-2:      oklch(88%   0.008 70);   /* 更淡的发丝线 */

  /* On the near-black entry surface */
  --color-ink-paper:   oklch(92%   0.010 70);   /* 暗底上的正文 */
  --color-ink-muted:   oklch(66%   0.010 68);   /* 暗底上的弱化文字 */
  --color-ink-rule:    oklch(32%   0.012 66);   /* 暗底上的发丝线 */

  /* 微光 — lighter than paper, so it only reads where the fog is thick.
   * Not a base surface; it is a light source inside the haze. */
  --color-glow:        oklch(99%   0.012 78);

  /* The plate — the illustration's own paper and ink, fixed by the
   * hand-drawn-quote-art skill. Deliberately NOT the site's warm fog: the
   * artworks are a series, and a series' colours are its identity. Every
   * exported gift uses these two values and no others, so a year of them
   * stacks into one body of work. */
  --color-plate-paper: #fdfdfb;
  --color-plate-ink:   #1a1a1a;

  /* The only chromatic colour on the page. Lands once: under the wordmark. */
  --color-accent:      oklch(64%   0.14  65);   /* 琥珀 */
  --color-accent-ink:  oklch(21%   0.012 66);   /* accent L > 50 → 用 ink 作叠字 */
  --color-focus:       oklch(60%   0.19  65);

  /* ---------- Type ---------- */
  /* Three roles. Instrument Serif is a display face and stays at display
   * sizes only (wordmark, statements). Newsreader carries everything meant to
   * be read at text size; its italic is the interior voice — the thoughts —
   * so the narrator is always upright and a thought is always italic.
   * Geist Mono is the single outlier — page furniture only. */
  --font-wordmark: "Instrument Serif", ui-serif, Georgia, serif;
  --font-display:  "Instrument Serif", ui-serif, Georgia, serif;
  --font-body:     "Newsreader", "Songti SC", ui-serif, Georgia, serif;
  --font-voice:    "Newsreader", "Songti SC", ui-serif, Georgia, serif;   /* + font-style: italic */
  --font-mono:     "Geist Mono", ui-monospace, SFMono-Regular, "SF Mono", monospace;
  /* Every page embeds all three families (latin subsets); the CJK names in
   * --font-body are system fallbacks for a Chinese sentence on the gift. */

  /* 1.25 major third, floored at 12.8px because CJK dies below that */
  --text-xs:        0.8rem;      /* 12.8px — mono furniture */
  --text-base:      1rem;
  --text-md:        1.25rem;     /* 20px */
  --text-body:      1.15rem;     /* 18.4px — Newsreader text; its x-height is larger than Instrument's */
  --text-label:     1.2rem;      /* 19.2px — buttons and verbs, Newsreader 500 */
  --text-lg:        1.5625rem;   /* 25px */
  --text-display-s: clamp(1.6rem, 3.6vw, 2.4414rem);
  --text-display:   clamp(2.75rem, 7vw, 5.25rem);
  --text-wordmark:  clamp(2.3rem, 6.6vw, 5.25rem);   /* the brand, and every page's H1 */
  /* Layer 02's statement + lede sizes. All sit under the 5.5rem display
   * ceiling. Hierarchy is carried by size, colour, and the serif/mono split —
   * Instrument Serif ships one weight, so weight contrast is not on the table. */
  --text-turn:      clamp(2.1rem, 5.2vw, 4rem);
  --text-lede:      clamp(1.15rem, 1.5vw + 0.6rem, 1.6rem);
  /* Layer 03. The greeting leads; the writing line sits quieter beneath it. */
  --text-greet:     clamp(1.5rem, 2.4vw, 2rem);
  --text-write:     clamp(1rem, 1.1vw + 0.5rem, 1.25rem);
  --text-quote:     clamp(1.05rem, 1.1vw + 0.7rem, 1.45rem);

  /* ---------- Space · 4pt scale ---------- */
  --space-3xs: 0.125rem;
  --space-2xs: 0.25rem;
  --space-xs:  0.5rem;
  --space-sm:  0.75rem;
  --space-md:  1rem;
  --space-lg:  1.5rem;
  --space-xl:  2.5rem;
  --space-2xl: 4rem;
  --space-3xl: 6rem;
  --space-4xl: 9rem;

  --page-gutter: clamp(1.25rem, 5vw, 5rem);

  /* ---------- Rules & radii ---------- */
  --rule-hair: 1px;
  --radius-none: 0;
  --radius-plate: 3px;    /* photographs have corners, barely */
  --radius-pill: 999px;   /* the invitation is the one rounded thing here */

  /* ---------- Motion ---------- */
  --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in:     cubic-bezier(0.7, 0, 0.84, 0);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);

  --dur-micro: 120ms;
  --dur-short: 220ms;
  --dur-long:  420ms;

  /* Weather durations. The opening is paced in seconds, not milliseconds —
   * a deliberate override of Hallmark's ≤500ms reveal / no-loop rules,
   * at the project owner's instruction. */
  --dur-emerge:  4200ms;   /* the field becoming visible */
  --dur-slow:    1600ms;   /* hover — weather, not UI feedback */
  --dur-drift-a: 21s;      /* the haze ground. Coprime-ish periods, so the */
  --dur-drift-b: 27s;      /* composite state never visibly repeats. */
  --dur-drift-c: 34s;
  --dur-breath:  15s;
  --dur-grow:    17s;
  /* The swarm's own timings are randomised per element in JS — see the
   * generator in index.html. These are only the bounds it draws from. */

  /* ---------- Depth ---------- */
  --z-base:   1;
  --z-raised: 10;
  --z-sticky: 200;
}

/* Everything is set in rem, so the 14" and 16" MacBooks (1512 and 1728 CSS px
 * wide) get the whole scale — type, space, plate — stepped up together rather
 * than 16px text sitting in ever more air. */
@media (min-width: 1500px) { html { font-size: 17px; } }
@media (min-width: 1700px) { html { font-size: 18px; } }
@media (min-width: 2200px) { html { font-size: 20px; } }

/* SOURCE FILE — the ground shared by layers 02 and 03; build.py prepends it to
 * each page's own stylesheet.
 *
 * One paper, the whole way down. Everything on layers 02 and 03 happens on
 * this: a bank of warm haze, the name in ghost letters far too large and far
 * too faint to read, paper dust, and one warm point of light that wanders.
 * The field never changes surface — no dark section, no cut — the moments
 * of each layer dissolve in and out on top of it. This is layer 01's field,
 * settled, so the three layers are one place.
 */

.ground {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: clip;
}
.ground__haze, .ground__glow {
  position: absolute;
  display: block;
  border-radius: 50%;
}
.ground__haze { mix-blend-mode: multiply; }
.ground__haze--a {
  inset-block-start: 6%;   inset-inline-start: 22%;
  inline-size: min(66vw, 54rem); aspect-ratio: 1.3;
  background: radial-gradient(closest-side,
    color-mix(in oklch, var(--color-paper-3) 60%, transparent), transparent 78%);
  filter: blur(72px);
  animation: ground-drift-a var(--dur-drift-a) var(--ease-in-out) infinite alternate;
}
.ground__haze--c {
  inset-block-start: 30%;  inset-inline-start: 34%;
  inline-size: min(46vw, 36rem); aspect-ratio: 2.1;
  background: radial-gradient(closest-side,
    color-mix(in oklch, var(--color-paper-3) 44%, transparent), transparent 76%);
  filter: blur(58px);
  animation: ground-drift-c var(--dur-drift-c) var(--ease-in-out) infinite alternate;
}
.ground__glow {
  inset-block-start: 22%;  inset-inline-start: 44%;
  inline-size: min(26vw, 20rem); aspect-ratio: 1.15;
  background: radial-gradient(closest-side, var(--color-glow), transparent 72%);
  filter: blur(46px);
  mix-blend-mode: screen;
  animation: ground-drift-c var(--dur-drift-c) var(--ease-in-out) infinite alternate;
}
@keyframes ground-drift-a { to { transform: translate3d(-5%, 4%, 0); } }
@keyframes ground-drift-c { to { transform: translate3d(-4%, -6%, 0); } }

/* The light. One warm point, soft-edged, that wanders the field on a path
   long enough that it is never seen to repeat. */
.ground__light {
  position: absolute;
  inset-block-start: 28%; inset-inline-start: 46%;
  inline-size: 18px; block-size: 18px;
  border-radius: 50%;
  background: radial-gradient(circle,
    color-mix(in oklch, var(--color-accent) 72%, white) 0,
    color-mix(in oklch, var(--color-accent) 42%, transparent) 38%,
    transparent 70%);
  filter: blur(1.2px);
  opacity: 0.85;
  animation: ground-wander 53s var(--ease-in-out) infinite alternate;
}
@keyframes ground-wander {
  0%   { transform: translate(0, 0); }
  30%  { transform: translate(-30vw, 16vh); }
  62%  { transform: translate(12vw, 34vh); }
  100% { transform: translate(26vw, -4vh); }
}

/* Ghost letters and dust are dealt by the generator (see GROUND_JS). */
.ground__ch {
  position: absolute;
  inset-inline-start: var(--x);
  inset-block-start: var(--y);
  font-family: var(--font-wordmark);
  font-size: var(--s);
  line-height: 1;
  color: var(--color-ink);
  opacity: var(--o);
  user-select: none;
}
.ground__dust {
  position: absolute;
  inset-inline-start: var(--x);
  inset-block-start: var(--y);
  inline-size: var(--s);
  block-size: var(--s);
  border-radius: 50%;
  background: var(--color-ink);
  opacity: var(--o);
}

/* Everything that is not the ground sits on it. */
.mast, main, .colophon, .substrate, .grain { position: relative; z-index: 1; }
.grain { z-index: calc(var(--z-sticky) - 1); }

@media (prefers-reduced-motion: reduce) {
  .ground__haze, .ground__glow, .ground__light { animation: none !important; }
}

/* SOURCE FILE — make.html is a single self-contained page and does not link
 * this stylesheet; it embeds a copy. Edit here, then run `python3 build.py`.
 *
 * Hallmark · macrostructure: bespoke (a two-state instrument, not a page)
 *   No catalog shape fits: this is one surface that changes what it is.
 *   State lives on <body data-state>; input / forming / gift are the same
 *   composition at three moments, so nothing jumps when it turns over.
 * nav: masthead (brand is the H1, per the owner's hierarchy note)
 * cta: the same glass pill as layer 02's invitation, but in flow — Export sits
 *   on one baseline with "Write another" under the gift's sentence and date.
 * theme: custom (inherited, unchanged)
 *
 * TWO-STATE WHITESPACE STRATEGY
 *   input  — the page is almost empty on purpose. One greeting at display
 *            size, one writing line, nothing else. No box, no label, no
 *            counter, no placeholder chrome: a ruled line on paper. The
 *            submit affordance does not exist until there are words to send,
 *            so the empty state has literally nothing to decide about.
 *   gift   — the composition tightens into a mount. The artwork sits in a
 *            plate with the widest margins on the page (a print in a frame
 *            is mostly frame), sentence above it, date beneath. The screen
 *            MIRRORS the export — same order, same proportions, same fixed
 *            template — but is not pixel-identical to it: a print earns more
 *            air around the plate than a screen can afford to give.
 *
 * motion: dissolve · gather · settle  (3 primitives)
 *   No spinner anywhere. The submitted sentence comes apart into the same
 *   motes that layer 01 used, they gather, and the drawing assembles out of
 *   them centre-outward. The wait is the metaphor, so it also covers a real
 *   asynchronous generator if one is ever wired in — `forming` holds
 *   indefinitely until the art is handed over.
 * pre-emit critique: P5 H5 E4 S5 R5 V5
 * contrast: pass (40–41) · mobile: pass (34, 49, 50–57) · tokens: pass (48)
 * v1.0.0
 */

/* ============================================================
   Base
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

/* Cross-document view transitions: the wordmark is the one element every
   layer shares, so it is the one that travels between them. */
@view-transition { navigation: auto; }
.mast__h a { view-transition-name: wordmark; }
::view-transition-group(wordmark) {
  animation-duration: 720ms;
  animation-timing-function: var(--ease-in-out);
}
@media (prefers-reduced-motion: reduce) {
  ::view-transition-group(*),
  ::view-transition-old(*),
  ::view-transition-new(*) { animation: none !important; }
}

html { overflow-x: clip; -webkit-text-size-adjust: 100%; }

body {
  overflow-x: clip;
  margin: 0;
  min-block-size: 100dvh;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-wordmark);
  -webkit-font-smoothing: antialiased;
  display: grid;
  grid-template-rows: auto 1fr auto auto;   /* mast · stage · footer · substrate */
}

/* The paper's tooth, same as layers 01 and 02. */
.grain {
  position: fixed;
  inset: 0;
  z-index: calc(var(--z-sticky) - 1);
  pointer-events: none;
  filter: url(#grain);
  mix-blend-mode: multiply;
  opacity: 0.05;
}

h1, h2, p { margin: 0; font-weight: 400; }

.filters { position: absolute; width: 0; height: 0; }

.skip { position: absolute; inset-inline-start: -9999px; font-family: var(--font-mono); font-size: var(--text-xs); }
.skip:focus-visible {
  inset-inline-start: var(--page-gutter); inset-block-start: var(--space-md);
  z-index: var(--z-toast); background: var(--color-ink); color: var(--color-paper);
  padding: var(--space-xs) var(--space-sm);
  outline: 2px solid var(--color-focus); outline-offset: 3px;
}

a:focus-visible,
button:focus-visible,
textarea:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 6px; }

/* ============================================================
   Masthead
   ============================================================ */

.mast {
  display: flex; flex-wrap: wrap;
  justify-content: space-between; align-items: baseline;
  gap: var(--space-sm) var(--space-lg);
  padding: var(--space-2xl) var(--page-gutter) 0;
}
.mast__h {
  font-size: var(--text-wordmark); line-height: 1.02; letter-spacing: -0.008em;
  overflow-wrap: anywhere; min-inline-size: 0;
}
.mast__h a { color: var(--color-ink); text-decoration: none; transition: color var(--dur-short) var(--ease-out); }
.mast__h a:hover { color: var(--color-ink-2); }
.mast__layer {
  font-family: var(--font-mono); font-size: var(--text-xs);
  letter-spacing: 0.16em; color: var(--color-muted); white-space: nowrap;
}
/* While the sentence is being drawn the stamp reads GENERATING and breathes. */
[data-state="forming"] .mast__layer { animation: note-breathe 2s var(--ease-in-out) infinite alternate; }

/* ============================================================
   Stage · one thought on the left, the card on the right.
   After the film: the label, the sentence at display size, the verb;
   and across from it the print, arriving. The stage keeps its first-
   screen height; the caption sits at its foot.
   ============================================================ */

.stage {
  position: relative;
  isolation: isolate;
  overflow: clip;
  /* The first screen is mast + stage + colophon; 12.5rem is what the
     masthead and colophon take. */
  min-block-size: calc(100dvh - 12.5rem);
  /* The drawing's size. The card adds its own margins around it. Bounded by
     height so the whole card, wrapped or open, sits inside the stage. */
  --plate: min(22rem, calc(100dvh - 37rem), 34vw);
  --card-pad: clamp(1rem, 2.2vw, 1.6rem);
  display: grid;
  /* Two equal halves: the thought on the left, the card centred in the
     right half rather than pushed to the edge. */
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  column-gap: var(--space-2xl);
  align-items: center;
  padding: var(--space-3xl) var(--page-gutter) clamp(var(--space-3xl), 14vh, var(--space-4xl));
}

.forming__field {
  position: absolute;
  inset: 0;
  z-index: var(--z-raised);
  overflow: clip;
  pointer-events: none;
}

/* ---------- left ---------- */

.left {
  position: relative;
  z-index: var(--z-raised);
  display: grid;
  gap: var(--space-lg);
  align-content: center;
  max-inline-size: 34rem;
}
.label {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: 0.16em;
  color: var(--color-muted);
}

.ask {
  display: grid;
  gap: var(--space-xl);
  justify-items: start;
}
/* The line you write on, in the voice thoughts have everywhere here. */
.ask__field {
  display: block;
  inline-size: 100%;
  min-block-size: 1.4em;
  field-sizing: content;
  padding: 0 0 0.3em;
  border: 0;
  border-block-end: var(--rule-hair) solid var(--color-rule);
  border-radius: 0;
  background: transparent;
  color: var(--color-ink);
  font-family: var(--font-voice);
  font-style: italic;
  font-size: var(--text-lede);
  line-height: 1.4;
  resize: none;
  transition: border-color var(--dur-long) var(--ease-out);
}
.ask__field::placeholder { color: var(--color-muted); }
.ask__field:hover { border-block-end-color: var(--color-neutral); }
.ask__field:focus { outline: none; border-block-end-color: var(--color-ink-2); }
.ask__field:focus-visible { outline: none; border-block-end: 2px solid var(--color-focus); }

/* The verb is the same glass pill as Unwrap and Save. It does not exist
   until there is something to send. */
.ask .ask__go {
  opacity: 0;
  visibility: hidden;
  transform: translateY(4px);
  transition: opacity   var(--dur-long) var(--ease-out),
              transform var(--dur-long) var(--ease-out),
              visibility 0s var(--dur-long);
}
[data-ready="yes"] .ask .ask__go {
  opacity: 1;
  visibility: visible;
  transform: none;
  transition: opacity     var(--dur-long) var(--ease-out),
              transform   var(--dur-long) var(--ease-out),
              border-color var(--dur-short) var(--ease-out),
              color        var(--dur-short) var(--ease-out);
}
.ask .ask__go:disabled { cursor: default; opacity: 0; }

/* The sentence, kept: the same line, no longer editable. */
.said {
  display: none;
  padding-block-end: 0.3em;
  border-block-end: var(--rule-hair) solid var(--color-rule);
  font-family: var(--font-voice);
  font-style: italic;
  font-size: var(--text-lede);
  line-height: 1.4;
  color: var(--color-ink);
  overflow-wrap: anywhere;
}
.gift__actions {
  display: none;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: var(--space-lg);
}
[data-state="forming"] .ask,
[data-state="wrapped"] .ask,
[data-state="gift"]    .ask { display: none; }
[data-state="forming"] .said,
[data-state="wrapped"] .said,
[data-state="gift"]    .said { display: block; }
[data-state="gift"] .gift__actions { display: flex; animation: settle-in 900ms var(--ease-out) 2200ms both; }
.left .gift__again { display: none; justify-self: start; }
[data-state="gift"] .left .gift__again { display: inline-block; animation: settle-in 900ms var(--ease-out) 2200ms both; }
@keyframes settle-in { from { opacity: 0; transform: translateY(10px); } }

/* ---------- right ---------- */

.right {
  position: relative;
  z-index: var(--z-raised);
  display: grid;
  justify-items: center;
  align-content: center;
  justify-self: center;
  row-gap: var(--space-xl);
}

/* The card is one element through every moment. Its size is its content's,
   which is always present — invisible until the gift is open — so the edge
   that draws itself, the wrapping, and the opened print are all exactly the
   same box. */
.card {
  position: relative;
  margin: 0;
  opacity: 0;
  visibility: hidden;
  transition: opacity 700ms var(--ease-in-out), visibility 0s 700ms;
}
[data-state="forming"] .card,
[data-state="wrapped"] .card,
[data-state="gift"]    .card {
  opacity: 1;
  visibility: visible;
  transition: opacity 700ms var(--ease-in-out);
}
/* Wrapped: the card is picked up. Open: it is set down again. */
[data-state="wrapped"] .card { animation: card-lift 1.6s var(--ease-in-out) 300ms forwards; }
@keyframes card-lift { to { transform: scale(1.03) translateY(-4px); } }
[data-state="gift"] .card { animation: card-settle 1200ms var(--ease-out) 900ms both; }
@keyframes card-settle { from { transform: scale(1.03) translateY(-4px); } to { transform: none; } }

/* A light passes over the wrapped card once, just before it opens. */
.card__glint {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: var(--radius-plate);
  pointer-events: none;
  opacity: 0;
}
.card__glint::before {
  content: "";
  position: absolute;
  inset: -30%;
  background: linear-gradient(115deg,
    transparent 42%,
    color-mix(in oklch, var(--color-glow) 80%, transparent) 50%,
    transparent 58%);
  transform: translateX(-130%);
}
[data-state="wrapped"] .card__glint { opacity: 1; }
[data-state="wrapped"] .card__glint::before { animation: glint-pass 1.2s var(--ease-in-out) 900ms forwards; }
@keyframes glint-pass { to { transform: translateX(130%); } }

.card__edge {
  position: absolute;
  inset: 0;
  inline-size: 100%;
  block-size: 100%;
  overflow: visible;
  pointer-events: none;
}
.card__edge rect {
  fill: none;
  stroke: var(--color-rule);
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
  stroke-dasharray: 100;
  stroke-dashoffset: 100;
}
[data-state="forming"] .card__edge rect { animation: edge-draw 3.2s var(--ease-in-out) 300ms forwards; }
[data-state="wrapped"] .card__edge rect,
[data-state="gift"]    .card__edge rect { stroke-dashoffset: 0; }
@keyframes edge-draw { to { stroke-dashoffset: 0; } }

.forming__echo {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: var(--space-xl);
  margin: 0;
  font-family: var(--font-voice);
  font-style: italic;
  font-size: var(--text-body);
  line-height: 1.5;
  color: var(--color-muted);
  text-align: center;
  overflow-wrap: anywhere;
  opacity: 0;
  transition: opacity 900ms var(--ease-in-out);
}
[data-state="forming"] .forming__echo { opacity: 0.6; }

/* The print. Lighter than the page — a card laid on it — with the sentence
   above the drawing and the date beneath, as on the export. */
.card__paper {
  display: grid;
  justify-items: center;
  gap: var(--space-md);
  padding: var(--card-pad);
  background: color-mix(in oklch, var(--color-paper) 50%, white);
  border: var(--rule-hair) solid var(--color-rule);
  border-radius: var(--radius-plate);
  box-shadow: 0 1.6rem 3rem -2.2rem color-mix(in oklch, var(--color-ink) 45%, transparent);
  opacity: 0;
  transition: opacity 600ms var(--ease-in-out) 400ms;
}
[data-state="gift"] .card__paper { opacity: 1; }
.card__line, .card__meta { opacity: 0; }
[data-state="gift"] .card__line { animation: settle-in 800ms var(--ease-out) 1100ms both; }
[data-state="gift"] .card__meta { animation: settle-in 800ms var(--ease-out) 1900ms both; }
.card__line {
  max-inline-size: var(--plate);
  font-family: var(--font-voice);
  font-style: italic;
  font-size: var(--text-base);
  line-height: 1.4;
  color: var(--color-ink-2);
  text-align: center;
  overflow-wrap: anywhere;
}
/* The plate keeps the skill's own paper and ink, not the site's: the
   illustration belongs to a series, and the series' colours are its identity. */
.gift__plate {
  inline-size: var(--plate);
  aspect-ratio: 1;
  background: var(--color-plate-paper);
  overflow: hidden;
}
.gift__plate svg { display: block; inline-size: 100%; block-size: 100%; }
.card__meta {
  display: grid;
  justify-items: center;
  gap: var(--space-2xs);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--color-muted);
  text-align: center;
}

/* The wrapping: paper over the whole card. Wrapped, it is simply there;
   opened, it parts in two leaves and the drawing assembles underneath. */
.gift__wrap { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 900ms var(--ease-in-out); perspective: 1400px; }
[data-state="wrapped"] .gift__wrap,
[data-state="gift"]    .gift__wrap { opacity: 1; }
.gift__wrap::before,
.gift__wrap::after {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--color-paper-2);
  border: var(--rule-hair) solid var(--color-rule);
  border-radius: var(--radius-plate);
}
/* Two leaves, hinged at the outer edges, that swing open like doors. */
.gift__wrap::before { clip-path: inset(0 50% 0 0); transform-origin: left center; }
.gift__wrap::after  { clip-path: inset(0 0 0 50%); transform-origin: right center; }
[data-state="gift"] .gift__wrap::before { animation: leaf-left  1400ms cubic-bezier(0.6, 0, 0.3, 1) 150ms forwards; }
[data-state="gift"] .gift__wrap::after  { animation: leaf-right 1400ms cubic-bezier(0.6, 0, 0.3, 1) 150ms forwards; }
@keyframes leaf-left  { 55% { opacity: 1; } to { transform: rotateY(-100deg) translateX(-4%); opacity: 0; } }
@keyframes leaf-right { 55% { opacity: 1; } to { transform: rotateY(100deg)  translateX(4%);  opacity: 0; } }

/* The light the sentence became, let out as the card opens. */
.burst {
  position: absolute;
  inset: 0;
  z-index: var(--z-raised);
  pointer-events: none;
  overflow: visible;
}
.spark--burst { animation: burst var(--t) var(--ease-out) var(--d) forwards; }
@keyframes burst {
  0%   { opacity: 0;        transform: none; }
  12%  { opacity: var(--o); }
  100% { opacity: 0;        transform: translate(var(--bx), var(--by)) scale(0.4); }
}

/* The signature: the light, crossing from the field to the plate. */
.signlight {
  position: fixed;
  z-index: var(--z-sticky);
  inline-size: 18px;
  block-size: 18px;
  border-radius: 50%;
  translate: -50% -50%;
  pointer-events: none;
  background: radial-gradient(circle,
    color-mix(in oklch, var(--color-accent) 72%, white) 0,
    color-mix(in oklch, var(--color-accent) 42%, transparent) 38%,
    transparent 70%);
  filter: blur(1.2px);
}
.ground__light { transition: opacity 900ms var(--ease-in-out); }
.is-signing .ground__light { opacity: 0; transition-duration: 500ms; }
.gift__plate svg .signature { animation: sign-in 700ms var(--ease-out) both; }
@keyframes sign-in { from { opacity: 0; transform: scale(2.4); transform-box: fill-box; transform-origin: center; } }

/* A print you can pick up: the card tilts a little under the pointer. */
[data-state="gift"] .card { perspective: 1200px; }
[data-state="gift"] .card__paper { transition: opacity 600ms var(--ease-in-out) 400ms, transform 700ms var(--ease-out); }
[data-state="gift"] .card:hover .card__paper { transform: rotateX(1.5deg) rotateY(-2.5deg) translateY(-2px); }

/* Strokes assemble centre-outward once the leaves have parted. */
.gift__plate [data-i] {
  opacity: 0;
  animation: assemble 900ms var(--ease-out) both;
  animation-delay: calc(1300ms + var(--i) * 110ms);
  transform-box: fill-box;
  transform-origin: center;
}
@keyframes assemble { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: none; } }

/* The motes. */
.spark {
  position: absolute;
  inset-inline-start: var(--x);
  inset-block-start: var(--y);
  inline-size: var(--s);
  block-size: var(--s);
  background: var(--c);
  opacity: 0;
  animation: gather var(--t) var(--ease-in-out) var(--d) infinite;
}
@keyframes gather {
  0%   { opacity: 0;        transform: translate(0, 0) scale(1); }
  14%  { opacity: var(--o); transform: translate(calc(var(--gx) * 0.2), calc(var(--gy) * 0.2)) scale(1); }
  76%  { opacity: var(--o); transform: translate(calc(var(--gx) * 0.92), calc(var(--gy) * 0.92)) scale(0.7); }
  100% { opacity: 0;        transform: translate(var(--gx), var(--gy)) scale(0.4); }
}
[data-state="wrapped"] .forming__field,
[data-state="gift"]    .forming__field { opacity: 0; transition: opacity 900ms var(--ease-in-out); }

/* The caption at the foot of the stage. */
.stage__caption {
  position: absolute;
  inset-inline: var(--page-gutter);
  inset-block-end: clamp(var(--space-lg), 5vh, var(--space-2xl));
  z-index: var(--z-raised);
  text-align: center;
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: 0.12em;
  color: var(--color-muted);
}
.stage__caption--ready, .stage__caption--gift { display: none; }
[data-ready="yes"][data-state="input"] .stage__caption--ready { display: inline; animation: settle-in 600ms var(--ease-out) both; }
[data-state="gift"] .stage__caption--gift { display: inline; }

@keyframes note-breathe { to { opacity: 0.35; } }

/* The second action: a verb with a seam, the quieter sibling of the pill. */
.gift__again {
  position: relative;
  appearance: none; border: 0; background: none; padding: 0 0 var(--space-2xs);
  font-family: var(--font-body); font-weight: 500; font-size: var(--text-base);
  line-height: 1.5; color: var(--color-ink-2);
  cursor: pointer; white-space: nowrap;
  transition: color var(--dur-short) var(--ease-out);
}
.gift__again::after {
  content: "";
  position: absolute; inset-inline: 0; inset-block-end: 0;
  block-size: var(--rule-hair);
  background: var(--color-accent);
  opacity: 0.55;
  transition: opacity var(--dur-short) var(--ease-out);
}
.gift__again:hover { color: var(--color-ink); }
.gift__again:hover::after { opacity: 1; }

/* ============================================================
   Export — the same glass pill as layer 02's invitation, in flow.
   ============================================================ */

.cta {
  display: inline-flex;
  align-items: center;
  gap: var(--space-sm);
  min-block-size: 52px;
  padding: var(--space-md) var(--space-xl) var(--space-md) var(--space-lg);
  appearance: none;
  background: color-mix(in oklch, var(--color-glow) 55%, transparent);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  color: var(--color-ink);
  font-family: var(--font-body);
  font-weight: 500;
  font-size: var(--text-label);
  line-height: 1;
  letter-spacing: 0.01em;
  white-space: nowrap;
  cursor: pointer;
  border: var(--rule-hair) solid var(--color-ink);
  border-radius: var(--radius-pill);
  transition: border-color var(--dur-short) var(--ease-out),
              color        var(--dur-short) var(--ease-out),
              transform    110ms var(--ease-out);
}
.cta::before {
  content: "";
  inline-size: 5px;
  block-size: 5px;
  border-radius: 50%;
  background: var(--color-accent);
  animation: cta-breathe 1.6s var(--ease-in-out) infinite alternate;
}
@keyframes cta-breathe { from { opacity: 0.45; } to { opacity: 1; } }
.cta:hover, .cta:focus-visible { border-color: var(--color-accent); color: var(--color-accent); }
.cta:active { transform: translateY(1px); }
.cta:disabled { cursor: default; opacity: 0.6; }

/* ============================================================
   Footer
   ============================================================ */

.colophon {
  display: flex; flex-wrap: wrap; justify-content: space-between;
  gap: var(--space-sm) var(--space-lg); align-items: baseline;
  margin-inline: var(--page-gutter);
  padding-block: var(--space-lg) var(--space-lg);
  border-block-start: var(--rule-hair) solid var(--color-rule);
  font-family: var(--font-mono); font-size: var(--text-xs);
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--color-muted);
}
.colophon a {
  color: var(--color-muted); text-decoration: none; white-space: nowrap;
  border-block-end: var(--rule-hair) solid transparent;
  transition: color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out);
}
.colophon a:hover { color: var(--color-ink); border-block-end-color: var(--color-rule); }

/* Live region for the state changes — announced, never drawn. */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }


/* ============================================================
   The substrate — the page's last thing. Under the paper, the name as
   the machine holds it: a small bitmap in near-invisible ink, legible
   only where a passing light warms it. Same paper, no new surface; the
   deepest fog pools beneath the word. Drawn by the generator; this only
   sets the room it sits in.
   ============================================================ */

.substrate {
  position: relative;
  isolation: isolate;
  margin-inline: 0;            /* the name runs the full width of the page */
  padding-block: var(--space-md) 0;
  display: flow-root;          /* so the canvas's negative bottom margin shortens this box */
  overflow: clip;              /* and the lower half of the name hangs below it */
}
/* Edge to edge: the name is the width of the viewport here, and only its
   upper half shows; the generator sets the negative bottom margin. */
.substrate__px { display: block; inline-size: 100%; }

/* ============================================================
   ≤ 40rem — one column: the thought, then the card beneath it.
   ============================================================ */

@media (max-width: 40rem) {
  .stage {
    --plate: calc(100vw - 2 * var(--page-gutter) - 2 * var(--card-pad));
    grid-template-columns: minmax(0, 1fr);
    row-gap: var(--space-2xl);
    align-content: start;
    padding-block: var(--space-2xl) var(--space-3xl);
    min-block-size: auto;
  }
  .left { max-inline-size: none; }
  .stage__caption { position: static; inset: auto; margin-block-start: var(--space-xl); }
  .cta {
    font-size: var(--text-base); min-block-size: 44px;
    padding: var(--space-sm) var(--space-lg) var(--space-sm) var(--space-md);
  }
}

/* ============================================================
   Reduced motion — the gift is simply there, open, fully drawn.
   ============================================================ */

@media (prefers-reduced-motion: reduce) {
  .card, .card__edge rect, .gift__plate [data-i], .spark, .gift__actions, .mast__layer,
  .gift__wrap::before, .gift__wrap::after, .card__glint::before, .card__line, .card__meta {
    animation: none !important;
    transform: none !important;
  }
  .gift__plate [data-i], .gift__actions, .card__line, .card__meta { opacity: 1; }
  .card__edge rect { stroke-dashoffset: 0; }
  [data-state="gift"] .gift__wrap, .card__glint, .burst, .signlight { display: none; }
  .gift__plate svg .signature { animation: none; }
  [data-state="gift"] .card:hover .card__paper { transform: none; }
  .card, .card__paper, .gift__wrap, .forming__echo, .ask__field, .ask__go, .cta, .forming__field { transition: none; }
  .cta::before { animation: none; opacity: 1; }
}

</style>

<!-- The ground: one paper the whole way down. Haze, ghost letters, dust, and

  <section class="right">

<!-- The substrate. Under the paper, the name as the machine holds it: a

<script>
/* ------------------------------------------------------------
   The ground's loose parts: the name in ghost letters, and dust.
   Dealt once at load, never animated — they are the paper, not weather.
   ------------------------------------------------------------ */
(function () {
  var g = document.querySelector('.ground');
  if (!g) return;
  var R = function (a, b) { return a + Math.random() * (b - a); };
  var frag = document.createDocumentFragment();
  var letters = ['L', 'i', 'g', 'h', 't', 'o', 'n', 'g', 'h', 'i'];
  for (var i = 0; i < letters.length; i++) {
    var c = document.createElement('span');
    c.className = 'ground__ch';
    c.textContent = letters[i];
    c.style.setProperty('--x', R(2, 90).toFixed(1) + '%');
    c.style.setProperty('--y', R(4, 86).toFixed(1) + '%');
    c.style.setProperty('--s', R(5, 10).toFixed(1) + 'vw');
    c.style.setProperty('--o', R(0.022, 0.045).toFixed(3));
    frag.appendChild(c);
  }
  var n = Math.round(Math.min(90, Math.max(30, window.innerWidth * window.innerHeight / 18000)));
  for (var k = 0; k < n; k++) {
    var d = document.createElement('span');
    d.className = 'ground__dust';
    d.style.setProperty('--x', R(0, 100).toFixed(2) + '%');
    d.style.setProperty('--y', R(0, 100).toFixed(2) + '%');
    d.style.setProperty('--s', R(1, 2.2).toFixed(2) + 'px');
    d.style.setProperty('--o', R(0.12, 0.38).toFixed(2));
    frag.appendChild(d);
  }
  g.appendChild(frag);
})();

/* ============================================================================
   Layer 03 — the instrument.

   WHAT THIS IS, HONESTLY
   `hand-drawn-quote-art` is a Claude Code skill: it runs in an agent, not in a
   browser, so this page cannot call it. What it does instead is carry the
   skill's METHOD across — the anchor-word extraction, the three-mode priority,
   and the whole visual specification (ink #1a1a1a on paper #fdfdfb, the
   handwriting stack, dashes instead of solid strokes, irregular beziers,
   1–2 degrees of tilt, one or two elements and no more, a 680 square).

   The judgement is therefore a lookup, not an LLM's reading. It is good on the
   concrete words people actually reach for and plain on the ones it has never
   seen — where it falls back to Mode 1, exactly as the skill instructs. The
   studio chain above it (Claude locally, Gemini in the cloud) is the real
   thing; this generator is the always-there floor beneath both.

   SEEDED, NOT RANDOM
   Every random draw comes from a hash of your sentence. The same thought
   always makes the same picture. A gift should be determined by the thing it
   is a gift about.
   ============================================================================ */
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var body = document.body;

  /* ---------- seeded randomness ---------- */
  function hash(str) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }
  function rngFrom(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ---------- the skill's step 2: find a visual anchor ----------
     Not the most important word — the one that can become a shape. */
  var STOP = ('a an the and or but if of to in on at for with from into over '
    + 'is am are was were be been being do does did done have has had i me my '
    + 'you your he she it we they them this that these those there here what '
    + 'when where why how not no yes so as by up out just very really some any '
    + 'about would could should will can may might must its it’s '
    + "i'm i’m i've i’ve don't don’t didn't didn’t isn't isn’t it's can't can’t "
    + "won't won’t you're you’re that's that’s there's there’s").split(' ');

  /* Crude, deliberately: enough to see through a plural or a tense so that
     "bleeds" reaches the pun list that only knows "bleed". A real stemmer
     would be more than this lookup deserves. */
  function stems(w) {
    var out = [w];
    if (/ies$/.test(w)) out.push(w.slice(0, -3) + 'y');
    if (/ing$/.test(w)) { out.push(w.slice(0, -3)); out.push(w.slice(0, -3) + 'e'); }
    if (/ed$/.test(w))  { out.push(w.slice(0, -2)); out.push(w.slice(0, -1)); }
    if (/e?s$/.test(w)) { out.push(w.replace(/e?s$/, '')); out.push(w.slice(0, -1)); }
    return out;
  }

  /* word -> shape. Each shape is a drawing the skill would recognise. */
  var ANCHOR = {
    rings:   'attention focus centre center notice listen watch quiet still hold wait patience present ' +
             'aware awake careful care mind minds mindful concentrate around circle',
    bleed:   'bleed spread soak leak seep spill ink stain blur everything through spreads bleeds ' +
             'saturate flood pour drown wash',
    spiral:  'again return world back repeat cycle turn spin round loop memory remember returning ' +
             'circles orbit endless forever begin beginning start',
    sprout:  'grow grows growing plant plants seed seeds root roots tree leaf leaves bloom flower ' +
             'garden spring alive become becoming green branch',
    horizon: 'space room breathe breath sea ocean sky far distance horizon alone empty quiet ' +
             'silence wide open outside field air light morning',
    thread:  'thread path way line walk road journey follow lost find story trail wander drift ' +
             'route trace connect between across poem poems word words song songs letter ' +
             'sentence write writing wrote read reading language name',
    scatter: 'forget forgot scatter gone lose lost disappear fade vanish leave leaving fleeting ' +
             'moment brief passing slip escape almost never',
    weight:  'weight heavy carry hold burden load lift press down pull gravity anchor sink deep',
    /* The bank's own anchors. The built-in drawer borrows a shape for each
       (see BORROW); the bank has drawings of its own. */
    moon:    'moon night midnight dark darkness shadow shadows star stars evening sleep dream dreams tonight',
    rain:    'rain rains rained raining drop drops weather storm cloud clouds wet umbrella',
    window:  'window windows glass wall watch looking view outside inside frame',
    door:    'door doors open opened close closed enter exit knock room key keys',
    bridge:  'bridge bridges cross crossing between meet meeting us together apart shore',
    mountain:'mountain mountains climb climbed hill hills summit peak high height steep',
    fire:    'fire flame flames burn burning lit match candle warm warmth spark ember ash',
    hand:    'hand hands touch touched palm finger fingers call mother father friend hug held',
    home:    'home house roof kitchen table bed door stay family return',
    wait:    'wait waiting rest slow patience pause still kettle tea sunday',
    farewell:'goodbye farewell leave leaving left gone ending end last passing lose losing'
  };
  var BORROW = { moon: 'rings', rain: 'scatter', window: 'contrast', door: 'horizon', bridge: 'thread',
                 mountain: 'horizon', fire: 'sprout', hand: 'weight', home: 'horizon', wait: 'rings',
                 farewell: 'scatter' };

  /* Words with a literal AND a figurative sense — the skill's Mode 2, its
     highest-priority mode. Drawing the literal one and letting the reader
     arrive at the other is where this style earns its keep. */
  var PUNS = ('bleed grow root plant weight light hold break drift seed spark thread anchor bloom '
    + 'fall reach current shadow space run fold carry water burn sink float land ground touch').split(' ');

  /* Mode 3 fires when the sentence sets two things against each other. */
  var CONTRAST_MARKS = [' but ', ' yet ', ' versus ', ' vs ', ' instead of ', ' rather than ',
                        ' and not ', ' or ', ' between '];

  /* The same maps for Chinese. There are no spaces to split on, so these are
     matched as substrings of the whole sentence; the longest hit per shape
     wins, and longer hits beat shorter ones across shapes (清晨 beats 光).
     Without this table every Chinese sentence missed every anchor and fell
     into the same default rings — a wall of near-identical gifts. */
  var ANCHOR_ZH = {
    rings:   '专注 注意 倾听 聆听 安静 宁静 平静 耐心 等待 当下 中心 凝视 目光 守护 陪伴 圆 环',
    bleed:   '晕开 蔓延 弥漫 淹没 流淌 渗 墨 染 浸 洇',
    spiral:  '重复 循环 旋转 回来 回去 记忆 回忆 永远 又一次 再一次 开始 轮回 归 绕',
    sprout:  '生长 成长 种子 种下 扎根 开花 发芽 生命 成为 长出 根 树 叶 花 春 绿 枝',
    horizon: '呼吸 大海 天空 远方 距离 地平线 孤独 独自 空旷 辽阔 田野 清晨 阳光 黎明 自由 海 风 光 晨',
    thread:  '旅程 旅行 跟随 迷路 寻找 找到 故事 文字 句子 语言 名字 连接 线 路 诗 字 词 歌 信 写 读 桥',
    scatter: '忘记 遗忘 散落 消失 淡去 逝去 离开 瞬间 短暂 溜走 错过 飘散 流逝 来不及',
    weight:  '重量 沉重 背负 负担 举起 下沉 深处 放下 扛 压 锚',
    moon:    '月亮 月光 夜晚 深夜 午夜 黑暗 影子 星星 星空 睡 梦 今晚 月 夜 星',
    rain:    '下雨 雨水 雨天 雨滴 乌云 天气 暴雨 伞 雨 云',
    window:  '窗户 窗外 窗前 玻璃 墙 看着 望 窗',
    door:    '门口 开门 关门 敲门 钥匙 房间 进来 出去 门',
    bridge:  '桥 相遇 之间 一起 分开 岸 对岸 渡',
    mountain:'山 爬山 登山 山顶 高处 陡 峰',
    fire:    '火 火焰 燃烧 点燃 火柴 蜡烛 温暖 火花 灰烬',
    hand:    '手 触碰 手掌 手指 打电话 妈妈 爸爸 朋友 拥抱 握',
    home:    '家 房子 屋顶 厨房 餐桌 床 回家 家人',
    wait:    '等待 等 休息 慢 耐心 停 水壶 茶 周日',
    farewell:'再见 告别 离开 走了 结束 最后 经过 失去 道别'
  };
  var PUNS_ZH = '光 重 根 线 沉 深 流 落 散 长 断 种 背 转 空 浮 烧 触 折'.split(' ');
  var CONTRAST_ZH = ['但', '却', '而是', '而不是', '与其', '宁可', '宁愿', '还是', '可是',
                     '然而', '反而', '不如'];

  function candsZH(text) {
    var out = [];
    for (var key in ANCHOR_ZH) {
      var list = ANCHOR_ZH[key].split(' ');
      var best = null;
      for (var i = 0; i < list.length; i++) {
        if (text.indexOf(list[i]) > -1 && (!best || list[i].length > best.length)) best = list[i];
      }
      if (best) {
        out.push({ word: best, shape: key,
                   pun: PUNS_ZH.some(function (p) { return best.indexOf(p) > -1; }) });
      }
    }
    out.sort(function (a, b) { return b.word.length - a.word.length; });
    return out;
  }

  function words(text) {
    return text.toLowerCase().replace(/[^\p{L}\p{N}\s'’]/gu, ' ')
               .split(/\s+/).filter(Boolean);
  }

  function analyse(text) {
    var w = words(text);
    var meaty = w.filter(function (x) { return STOP.indexOf(x) === -1 && x.length > 2; });

    /* Collect every word that maps to a shape, then choose.
       The skill puts Mode 2 first — "命中就优先用" — so a word with a double
       sense beats an earlier word without one. Scanning left-to-right and
       taking the first hit gets "Writing bleeds into everything" wrong: it
       lands on `writing` and throws away the pun the whole line is built on. */
    var cands = [];
    for (var i = 0; i < meaty.length; i++) {
      var forms = stems(meaty[i]);
      for (var key in ANCHOR) {
        var list = ANCHOR[key].split(' ');
        if (forms.some(function (f) { return list.indexOf(f) > -1; })) {
          cands.push({ word: meaty[i], shape: key,
                       pun: forms.some(function (f) { return PUNS.indexOf(f) > -1; }) });
          break;
        }
      }
    }
    if (/[一-鿿]/.test(text)) { cands = cands.concat(candsZH(text)); }
    var chosen = cands.filter(function (c) { return c.pun; })[0] || cands[0] || null;
    var anchor = chosen ? chosen.word : null;
    var shape  = chosen ? chosen.shape : null;

    var lower = ' ' + text.toLowerCase() + ' ';
    var hasContrast = CONTRAST_MARKS.some(function (m) { return lower.indexOf(m) > -1; })
                   || CONTRAST_ZH.some(function (m) { return text.indexOf(m) > -1; });
    var isPun = !!(chosen && chosen.pun);

    /* The skill's priority order, checked in order: 2 beats 3 beats 1. */
    var mode = isPun ? 2 : (hasContrast ? 3 : 1);
    if (!shape) { shape = 'rings'; }          /* Mode 1 is the fallback, per the skill */
    if (mode === 3) { shape = 'contrast'; }

    return { anchor: anchor || (meaty[0] || 'thought'), shape: shape, mode: mode };
  }

  /* ---------- hand-drawn primitives ----------
     Regular geometry reads as a UI icon. Everything below is nudged
     off-true on purpose: broken strokes, asymmetric control points. */
  var INK = '#1a1a1a';

  function jitterPath(pts, r, amt) {
    var d = '';
    for (var i = 0; i < pts.length; i++) {
      var x = pts[i][0] + (r() - 0.5) * amt;
      var y = pts[i][1] + (r() - 0.5) * amt;
      if (i === 0) { d += 'M' + x.toFixed(1) + ' ' + y.toFixed(1); }
      else {
        var px = pts[i - 1][0], py = pts[i - 1][1];
        var cx = (px + x) / 2 + (r() - 0.5) * amt * 1.6;
        var cy = (py + y) / 2 + (r() - 0.5) * amt * 1.6;
        d += ' Q' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + x.toFixed(1) + ' ' + y.toFixed(1);
      }

  function stroke(d, w, dash) {

    return '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r.toFixed(1) + '" fill="' + INK + '"/>';
  }
  function blob(cx, cy, rad, r) {
    var pts = [], n = 13;
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2;

    }
    pts.push(pts[0]);
    return '<path d="' + jitterPath(pts, r, 8) + ' Z" fill="' + INK + '"/>';
  }

  /* ---------- the eight drawings ---------- */
  var SHAPES = {
    rings: function (r) {
      var out = [], n = 4 + Math.floor(r() * 2);
      for (var i = 0; i < n; i++) {
        var rad = 58 + i * (44 + r() * 14);
        out.push('<circle cx="340" cy="352" r="' + rad.toFixed(0) + '" fill="none" stroke="' + INK +
                 '" stroke-width="2.2" stroke-dasharray="' + (3 + i) + ' ' + (9 + i) + '"/>');
      }
      out.push(dot(340, 352, 4.5));
      return out;
    },
    bleed: function (r) {
      var out = [blob(340, 340, 104, r)];
      var n = 14 + Math.floor(r() * 6);
      for (var i = 0; i < n; i++) {
        var a = r() * Math.PI * 2, d = 165 + r() * 250;
        out.push(dot(340 + Math.cos(a) * d, 340 + Math.sin(a) * d * 0.88, 2 + r() * 4.5));
      }
      return out;
    },
    spiral: function (r) {
      var pts = [], turns = 3.2 + r() * 0.9;
      for (var i = 0; i <= 130; i++) {
        var t = i / 130, a = t * Math.PI * 2 * turns, rad = 16 + t * 236;
        pts.push([340 + Math.cos(a) * rad, 344 + Math.sin(a) * rad]);
      }
      return [stroke(jitterPath(pts, r, 3), 2.2, '5 9'), dot(340, 344, 4)];
    },
    sprout: function (r) {
      var stem = [];
      for (var i = 0; i <= 10; i++) {
        var t = i / 10;
        stem.push([340 + Math.sin(t * 2.3) * 40, 588 - t * 452]);
      }
      var out = [stroke(jitterPath(stem, r, 5), 2.6, null)];
      for (var k = 0; k < 3; k++) {
        var y = 470 - k * 132, dir = k % 2 ? 1 : -1;
        var leaf = [[340, y], [340 + dir * 92, y - 48], [340 + dir * 158, y - 8],
                    [340 + dir * 74, y + 30], [340, y]];
        out.push(stroke(jitterPath(leaf, r, 7), 2.2, '4 9'));
      }
      out.push(dot(340, 596, 5));
      return out;
    },
    horizon: function (r) {
      var line = [];
      for (var i = 0; i <= 10; i++) { line.push([70 + i * 54, 430]); }
      var out = [stroke(jitterPath(line, r, 5), 2.2, null)];
      out.push(stroke(jitterPath([[340, 430], [338, 352], [342, 286]], r, 6), 2, '4 10'));
      for (var i = 0; i < 7; i++) {
        out.push(dot(140 + r() * 400, 180 + r() * 150, 2 + r() * 3));
      }
      return out;
    },
    thread: function (r) {
      var pts = [];
      for (var i = 0; i <= 16; i++) {
        var t = i / 16;
        pts.push([90 + t * 500, 380 + Math.sin(t * 5.4) * 122]);
      }
      var out = [stroke(jitterPath(pts, r, 7), 2.2, '6 10')];
      out.push('<circle cx="' + (90 + 0.62 * 500).toFixed(0) + '" cy="' +
               (380 + Math.sin(0.62 * 5.4) * 122).toFixed(0) +
               '" r="15" fill="none" stroke="' + INK + '" stroke-width="2.2"/>');
      return out;
    },
    scatter: function (r) {
      var out = [blob(238, 356, 40, r)];
      var n = 20 + Math.floor(r() * 8);
      for (var i = 0; i < n; i++) {
        var t = i / n;
        out.push(dot(268 + t * 330 + (r() - 0.5) * 60,
                     356 + (r() - 0.5) * 250 * t + 10, Math.max(1.4, 6 * (1 - t))));
      }
      return out;
    },
    weight: function (r) {
      var out = [blob(340, 470, 116, r)];
      for (var i = 0; i < 6; i++) {
        var y = 292 - i * 46;
        out.push(stroke(jitterPath([[196 - i * 20, y], [484 + i * 20, y]], r, 5), 2.2,
                        (3 + i) + ' ' + (8 + i)));
      }
      return out;
    },
    /* Mode 3 — one eye looking at two kinds of thing. */
    contrast: function (r) {
      var out = [];
      for (var i = 0; i <= 5; i++) {
        out.push(stroke(jitterPath([[76, 196 + i * 60], [286, 196 + i * 60]], r, 2), 1.6, '2 6'));
        out.push(stroke(jitterPath([[76 + i * 42, 196], [76 + i * 42, 496]], r, 2), 1.6, '2 6'));
      }
      out.push(stroke(jitterPath([[340, 168], [336, 300], [344, 420], [338, 528]], r, 7), 2, '4 9'));
      var sc = [];
      for (var k = 0; k <= 22; k++) {
        var t = k / 22;
        sc.push([420 + Math.sin(t * 11) * 88 + t * 70, 250 + Math.cos(t * 8.5) * 96 + t * 40]);
      }
      out.push(stroke(jitterPath(sc, r, 9), 2.2, null));
      return out;
    }
  };

  /* ---------- assemble the plate ---------- */
  function draw(text) {
    var _a = analyse(text);
    if (BORROW[_a.shape]) { _a.shape = BORROW[_a.shape]; }
    return drawWith(text, _a);
  }
  function drawWith(text, a0) {
    var a = a0;
    var r = rngFrom(hash(text.trim().toLowerCase()));
    var parts = SHAPES[a.shape](r);
    var tilt = (r() * 2 - 1) * 1.4;                    /* the skill's 1–2 degrees, once */
    var inner = parts.map(function (p, i) {
      return p.replace(/^<(\w+)/, '<$1 data-i style="--i:' + i + '"');
    }).join('');
    var svg =
      '<svg viewBox="0 0 680 680" role="img" xmlns="http://www.w3.org/2000/svg">' +
      '<rect x="0" y="0" width="680" height="680" fill="#fdfdfb"/>' +
      '<g transform="rotate(' + tilt.toFixed(2) + ' 340 340)">' + inner + '</g></svg>';
    return { svg: svg, meta: a };
  }

  /* ---------- state ---------- */
  var field = $('field'), go = $('go'), live = $('live'), form = $('ask');
  var current = { text: '', date: '' };

  var layerStamp = $('stamp'), LAYER_STAMP = layerStamp.textContent;
  function setState(s) {
    body.dataset.state = s;
    layerStamp.textContent =
      s === 'forming' ? 'LAYER 03 \u2014 GENERATING\u2026' :
      s === 'wrapped' ? 'LAYER 03 \u2014 READY' : LAYER_STAMP;
    if (s === 'forming') { live.textContent = 'Translating your sentence.'; }
    if (s === 'wrapped') { live.textContent = 'Your gift is wrapped, and opening.'; }
    if (s === 'gift') { live.textContent = 'Your gift is open. Export downloads a JPG.'; }
  }

  field.addEventListener('input', function () {
    body.dataset.ready = field.value.trim().length > 1 ? 'yes' : 'no';
    go.disabled = field.value.trim().length < 2;
  });
  /* Enter sends; Shift+Enter makes a new line. */
  field.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  function stamp(d) {
    var M = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY',
             'AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
    return String(d.getDate()).padStart(2, '0') + ' ' + M[d.getMonth()] + ' ' + d.getFullYear();
  }

  /* ---------- forming: dissolve, then gather. No spinner. ---------- */
  function sow(text) {
    var host = $('sparks');
    host.textContent = '';
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return;
    var r = rngFrom(hash(text) ^ 0x9e37);
    var n = Math.min(52, 16 + text.length);
    /* From the sentence, kept on the left, to the centre of the card. */
    var field = host.getBoundingClientRect();
    var from  = $('said').getBoundingClientRect();
    var to    = $('gift').getBoundingClientRect();
    var tx = to.left + to.width / 2 - field.left, ty = to.top + to.height / 2 - field.top;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < n; i++) {
      var s = document.createElement('span');
      s.className = 'spark';
      var x = from.left - field.left + r() * from.width;
      var y = from.top - field.top + r() * from.height;
      s.style.setProperty('--x', x.toFixed(1) + 'px');
      s.style.setProperty('--y', y.toFixed(1) + 'px');
      s.style.setProperty('--gx', ((tx - x) * (0.86 + r() * 0.12)).toFixed(1) + 'px');
      s.style.setProperty('--gy', ((ty - y) * (0.86 + r() * 0.12)).toFixed(1) + 'px');
      s.style.setProperty('--s', (1.6 + r() * 3.4).toFixed(2) + 'px');
      s.style.setProperty('--o', (0.22 + r() * 0.5).toFixed(2));
      s.style.setProperty('--c', r() < 0.16 ? 'var(--color-accent)' : 'var(--color-ink-2)');
      s.style.setProperty('--t', (2.6 + r() * 2.4).toFixed(2) + 's');
      s.style.setProperty('--d', (-r() * 4).toFixed(2) + 's');
      frag.appendChild(s);
    }
    host.appendChild(frag);
  }


  /* Injected markup is injected markup, whoever drew it. */
  function sanitizeSVG(raw) {
    return raw
      .replace(/<text[\s\S]*?<\/text>/gi, '')          /* the sentence is set by the page, never drawn */
      .replace(/<script[\s\S]*?<\/script>/gi, '')
      .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '')
      .replace(/javascript:/gi, '');
  }

  function present(text, art) {
    var d = new Date();
    current.text = text;
    current.date = stamp(d);
    $('giftLine').textContent = text;          /* the print's own caption — textContent, never innerHTML */
    var plate = $('plate');
    plate.innerHTML = art.svg;
    /* Assemble centre-outward whoever drew it: deal data-i to the top-level
       strokes so the CSS stagger also applies to SVGs that arrive without it. */
    var root = plate.querySelector('svg');
    if (root) {
      var host = root.querySelector('g') || root;
      var idx = 0;
      Array.prototype.forEach.call(host.children, function (el) {
        if (el.tagName.toLowerCase() === 'rect') return;
        el.setAttribute('data-i', '');
        el.style.setProperty('--i', idx++);
      });
    }
    /* Left on the element on purpose: who drew it, and (for local draws)
       which anchor and mode fired. Inspectable rather than mysterious. */
    plate.dataset.via = art.via;
    if (art.meta) {
      plate.dataset.anchor = art.meta.anchor;
      plate.dataset.mode = String(art.meta.mode);
      plate.dataset.shape = art.meta.shape;
    }
    $('giftDate').textContent = current.date;
    /* The signature — DRAWN BY “Light on Light” — lives on the export, where
       it means something; on screen the wordmark is already the signature.
       Only an offline draw is called out, because it is not the product's
       ceiling, and the studio is offered again. */
    $('giftVia').hidden = art.via !== 'local';
    $('redraw').hidden = art.via !== 'local';
    setState('gift');
    burst();
    setTimeout(sign, 1900);   /* once the leaves have opened */
  }

  /* The signature. When the gift is open, the light that wanders the field
     comes across to the plate and settles in the corner of the drawing as
     one amber cell — light on light. It is written into the SVG, so the
     export carries it too. */
  function sign() {
    var plate = $('plate'), svg = plate.querySelector('svg');
    if (!svg || body.dataset.state !== 'gift') return;
    var mark = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    mark.setAttribute('class', 'signature');
    mark.setAttribute('x', '622'); mark.setAttribute('y', '622');
    mark.setAttribute('width', '12'); mark.setAttribute('height', '12');
    mark.setAttribute('fill', '#c58a3a');
    mark.setAttribute('opacity', '0');
    svg.appendChild(mark);
    var settle = function () { mark.setAttribute('opacity', '0.9'); };
    var light = document.querySelector('.ground__light');
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || !light || !light.animate) { settle(); return; }
    var from = light.getBoundingClientRect(), pr = plate.getBoundingClientRect();
    var fx = from.left + from.width / 2, fy = from.top + from.height / 2;
    var tx = pr.left + pr.width * 0.923, ty = pr.top + pr.height * 0.923;
    var el = document.createElement('span');
    el.className = 'signlight';
    el.style.left = fx + 'px'; el.style.top = fy + 'px';
    document.body.appendChild(el);
    body.classList.add('is-signing');
    /* An arc, not a straight line: out and up a little first, then in. */
    var mx = (fx + tx) / 2 - fx, my = Math.min(fy, ty) - fy - 60;
    var a = el.animate([
      { transform: 'translate(0, 0) scale(1)', opacity: 0.95, offset: 0 },
      { transform: 'translate(' + mx.toFixed(0) + 'px, ' + my.toFixed(0) + 'px) scale(0.85)', opacity: 1, offset: 0.55 },
      { transform: 'translate(' + (tx - fx).toFixed(0) + 'px, ' + (ty - fy).toFixed(0) + 'px) scale(0.4)', opacity: 1, offset: 1 }

  }

  /* The light the sentence became, let out of the card as it opens. */
  function burst() {
    var host = $('burst');

    var box = host.getBoundingClientRect(), card = $('gift').getBoundingClientRect();

      s.className = 'spark spark--burst';

      s.style.setProperty('--y', cy.toFixed(1) + 'px');

      s.style.setProperty('--by', (Math.sin(a) * dist * 0.8).toFixed(1) + 'px');

      s.style.setProperty('--t', (1.1 + Math.random() * 0.9).toFixed(2) + 's');

  /* The real skill, through the studio server (server.py → claude -p).
     The studio can live in two places, tried in order:
       1. same origin — server.py locally, or a serverless deploy
       2. the owner's own machine at http://localhost:4180 — browsers treat
          localhost as a trustworthy origin, so even the HTTPS public page
          may call it; server.py's CORS allowlist decides who is let in.
     So the owner opens the public site with server.py running and gifts are
     drawn by Claude on her own login; every other visitor quietly falls
     through to the cloud studio or the built-in generator. The forming state holds as long
     as it takes; there is no spinner to lie with, only the gathering. */
  function callStudio(url, text) {
    var ctrl = new AbortController();
    var kill = setTimeout(function () { ctrl.abort(); }, 160000);
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text }),
      signal: ctrl.signal

      clearTimeout(kill);
      if (!r.ok) throw new Error('studio ' + r.status);
      return r.json();
    }).then(function (j) {
      if (!j.svg || j.svg.indexOf('<svg') !== 0) throw new Error('no svg');
      return { svg: sanitizeSVG(j.svg), via: j.via || 'claude', meta: null };
    });
  }

  /* Three studios, tried in order:
       1. same origin            — server.py locally, or the Vercel site itself
       2. the owner's machine    — localhost:4180 → her own Claude login
       3. the cloud              — the Vercel function → Gemini Flash
     So the owner's Claude wins when her server is up; everyone else still
     gets an LLM-drawn gift from the cloud; and only if all three are down
     does the built-in generator take over. */
  function askClaude(text) {
    var home = 'http://localhost:4180';
    var cloud = 'https://light-on-light.vercel.app';
    return callStudio('/api/translate', text)['catch'](function (err) {
      if (window.location.origin === home) throw err;   /* already tried it */
      return callStudio(home + '/api/translate', text);
    })['catch'](function (err) {
      if (window.location.origin === cloud) throw err;  /* already tried it */
      return callStudio(cloud + '/api/translate', text);
    });
  }

  /* The bank: drawings the studio made earlier, kept on the site itself, so
     a studio that is out of reach still answers in the same hand. Chosen by
     anchor, then by the sentence's hash — the same sentence always finds
     the same drawing. Once the bank is curated only kept drawings count. */
  var bankIndex = null;
  function bankDraw(text) {
    var load = bankIndex ? Promise.resolve(bankIndex) :
      fetch('./bank/manifest.json').then(function (r) {
        if (!r.ok) throw new Error('no bank');
        return r.json();
      }).then(function (m) { bankIndex = m.items || []; return bankIndex; });
    return load.then(function (items) {
      var kept = items.filter(function (it) { return it.keep === true; });
      var pool = kept.length ? kept : items.filter(function (it) { return it.keep !== false; });
      if (!pool.length) throw new Error('empty bank');
      var a = analyse(text);
      var same = pool.filter(function (it) { return it.anchor === a.shape; });
      var cands = same.length ? same : pool;
      var pick = cands[hash(text) % cands.length];

        return r.text();

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    if (text.length < 2) return;

    $('echo').textContent = text;
    $('said').textContent = text;
    /* The card's caption and date go in now, unseen, so the card has its
       final size from the first frame of forming: the edge that draws, the
       wrapping and the open print are one box. */
    $('giftLine').textContent = text;
    $('giftDate').textContent = stamp(new Date());
    setState('forming');       /* the sentence is kept on the left before the motes leave it */
    sow(text);

       unreachable (double-clicked file, CLI missing, timeout). The gift
       always says which hand drew it. */
    /* Studio → bank → built-in generator. Only the last is called offline. */
    var art = askClaude(text)['catch'](function () {

  $('redraw').addEventListener('click', function () {

    body.dataset.ready = 'yes';
    go.disabled = false;
    form.requestSubmit();
  });

  $('again').addEventListener('click', function () {
    $('burst').textContent = '';
    body.classList.remove('is-signing');
    var stray = document.querySelector('.signlight'); if (stray) stray.remove();
    field.value = '';
    body.dataset.ready = 'no';
    go.disabled = true;
    setState('input');
    field.focus();
  });

  /* ---------- export ----------
     ONE fixed template, always. Same ground, same plate, same margins, same
     date position, same type. That is what makes a year of these read as one
     body of work instead of a folder of unrelated pictures. */
  var CARD = { w: 1080, h: 1400, scale: 2 };

  function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

  function wrap(ctx, text, maxW) {
    var out = [], line = '', w = text.split(' ');
    for (var i = 0; i < w.length; i++) {
      var test = line ? line + ' ' + w[i] : w[i];
      if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w[i]; }
      else { line = test; }
    }
    if (line) out.push(line);
    return out.slice(0, 4);
  }

  $('export').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true;
    var svgMarkup = $('plate').innerHTML;
    var blobUrl = URL.createObjectURL(new Blob([svgMarkup], { type: 'image/svg+xml;charset=utf-8' }));
    var img = new Image();

    img.onload = function () {
      var c = document.createElement('canvas');
      c.width = CARD.w * CARD.scale;
      c.height = CARD.h * CARD.scale;
      var ctx = c.getContext('2d');
      ctx.scale(CARD.scale, CARD.scale);

      /* ground — the card's paper, exactly as on screen */
      var paper = $('gift').querySelector('.card__paper');
      ctx.fillStyle = (paper && getComputedStyle(paper).backgroundColor) || cssVar('--color-paper') || '#f7f3ee';
      ctx.fillRect(0, 0, CARD.w, CARD.h);

      /* the sentence, the card's caption */
      ctx.save();
      ctx.translate(CARD.w / 2, 0);
      ctx.fillStyle = cssVar('--color-ink-2') || '#4a443c';
      ctx.textAlign = 'center';
      ctx.font = 'italic 40px ' + (cssVar('--font-voice') || 'serif');   /* same voice as on screen */
      var lines = wrap(ctx, current.text, CARD.w - 220);
      var top = 156 - (lines.length - 1) * 27;
      lines.forEach(function (l, i) { ctx.fillText(l, 0, top + i * 54); });
      ctx.restore();

      /* the plate. 156 above the sentence, 88 below the series mark: the card
         sits INTO itself rather than floating in the middle of its own frame. */
      var P = { x: 140, y: 300, s: 800 };
      ctx.fillStyle = cssVar('--color-plate-paper') || '#fdfdfb';
      ctx.fillRect(P.x, P.y, P.s, P.s);
      ctx.drawImage(img, P.x, P.y, P.s, P.s);

      /* date, series mark — as on the card */
      ctx.textAlign = 'center';
      ctx.fillStyle = cssVar('--color-ink-2') || '#4a443c';
      ctx.font = '17px ' + (cssVar('--font-mono') || 'monospace');
      ctx.fillText(spaced(current.date), CARD.w / 2, 1270);
      ctx.fillStyle = cssVar('--color-muted') || '#7d766b';
      ctx.font = '14px ' + (cssVar('--font-mono') || 'monospace');
      ctx.fillText(spaced('LIGHT ON LIGHT'), CARD.w / 2, 1312);

      var a = document.createElement('a');
      a.download = 'light-on-light-' + isoDay() + '.jpg';
      a.href = c.toDataURL('image/jpeg', 0.92);
      a.click();
      URL.revokeObjectURL(blobUrl);
      btn.disabled = false;
      live.textContent = 'Saved as JPG.';
    };
    img.onerror = function () {
      URL.revokeObjectURL(blobUrl);
      btn.disabled = false;
      live.textContent = 'That illustration could not be rendered. Try writing another.';
    };
    img.src = blobUrl;
  });

  function spaced(s) { return s.split('').join(' '); }
  function isoDay() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
           '-' + String(d.getDate()).padStart(2, '0');
  }

  setState('input');
  body.dataset.ready = 'no';
})();

/* ------------------------------------------------------------
   The substrate.
   Under the paper the name exists as a bitmap — the way the machine holds
   it — gutter to gutter across the foot of the page, and only the upper
   half of it: the rest has sunk below the page's edge. Ink so faint it is
   a watermark; a read head sweeps through and warms the cells it passes
   to amber; single cells glint — a brief amber point with a faint cross,
   the way light catches a grain — and a few stay lit, the same pixel
   lights as layer 01. Canvas, ~12 fps, drawn only while on screen; one
   still frame under reduced motion. Every glint is one cell, once, for
   under half a second; nothing here flickers faster than 0.6 Hz.
   ------------------------------------------------------------ */
(function () {
  var canvas = document.getElementById('substrate');
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext('2d');
  /* Cells about 8px wide whatever the viewport, never fewer than 64 across.
     The name is set to the full width; the row count follows from that. */
  var wide = canvas.parentNode.clientWidth || window.innerWidth;
  var COLS = Math.max(64, Math.min(256, Math.round(wide / 8))), ROWS = 16;
  var GAP = 0.26, TEXT = 'Light on Light';
  var SHOW = 0.62;  /* the fraction of the bitmap's height left above the page's edge */
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var css = getComputedStyle(document.documentElement);
  var tok = function (name, fb) { var v = css.getPropertyValue(name).trim(); return v || fb; };
  var INK   = tok('--color-ink', '#2b2622');
  var AMBER = tok('--color-accent', '#c07a2a');

  var cells = [], cw = 0;

  /* Rasterise the wordmark at cell resolution and keep every cell the
     letters touch. Edge cells keep their partial coverage as a dimmer base,
     which is what makes it read as the serif face and not a blob. */
  function sample() {
    var face = '"Instrument Serif", Georgia, serif';
    var probe = document.createElement('canvas').getContext('2d');
    probe.font = '100px ' + face;
    var unit = probe.measureText(TEXT).width / 100;      /* width per px of size */
    var size = (COLS - 2) / unit;                         /* edge to edge, by the metrics */
    var pass, d, minx, maxx;
    /* Two passes: fit by the font's metrics, then measure what was actually
       rasterised and correct once. A browser that measures with one face
       and paints with another (a webfont arriving late, a canvas that has
       not seen the face yet) would otherwise paint the word wider than the
       canvas and lose its last letter off the right edge. */
    for (pass = 0; pass < 2; pass++) {
      ROWS = Math.ceil(size * 1.15);
      var off = document.createElement('canvas');
      off.width = COLS; off.height = ROWS;
      var o = off.getContext('2d');
      o.font = size + 'px ' + face;
      o.fillStyle = '#fff';
      o.fillText(TEXT, 1, Math.round(size * 0.82));
      d = o.getImageData(0, 0, COLS, ROWS).data;
      minx = COLS; maxx = -1;
      for (var yy = 0; yy < ROWS; yy++) {
        for (var xx = 0; xx < COLS; xx++) {
          if (d[(yy * COLS + xx) * 4 + 3] / 255 >= 0.22) { if (xx < minx) minx = xx; if (xx > maxx) maxx = xx; }
        }
      }
      var painted = maxx - minx + 1;
      if (maxx < 0 || Math.abs(painted - (COLS - 2)) <= 2) break;
      size *= (COLS - 2) / painted;
    }
    var shift = maxx >= 0 ? 1 - minx : 0;                 /* the word starts one cell in */
    cells = [];
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var a = d[(r * COLS + c) * 4 + 3] / 255;
        if (a < 0.22) continue;
        var cc = c + shift;
        if (cc < 0 || cc >= COLS) continue;
        var aa = Math.min(1, a * 1.15), amber = Math.random() < 0.025;
        /* Ink cells are a watermark; the amber ones are lights. */
        cells.push({ c: cc, r: r, amber: amber,
                     base: amber ? 0.5 + 0.35 * aa : 0.12 + 0.2 * aa, dip: 0, left: 0, g: 0 });
      }
    }
  }

  function layout() {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var cssW = canvas.clientWidth || canvas.parentNode.clientWidth || 600;
    cw = cssW / COLS;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cw * ROWS * dpr);
    canvas.style.height = (cw * ROWS) + 'px';
    /* The lower part hangs below the footer's clipped box: cut in half. */
    canvas.style.marginBlockEnd = (-cw * ROWS * (1 - SHOW)) + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  var sweep = -4, frame = 0, last = 0, running = false, onScreen = false, raf = 0;

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var pad = cw * GAP, s = cw - pad * 2;
    for (var i = 0; i < cells.length; i++) {
      var k = cells[i], b = k.base, col = k.amber ? AMBER : INK;
      if (!reduce) {
        if (k.g > 0) {
          /* A glint: bright amber for a frame, then out over four more. */
          b = 0.3 + 0.65 * (k.g / 5); col = AMBER;
          if (k.g >= 4) {
            ctx.globalAlpha = b * 0.35; ctx.fillStyle = AMBER;
            ctx.fillRect((k.c - 1) * cw + pad, k.r * cw + pad, s, s);
            ctx.fillRect((k.c + 1) * cw + pad, k.r * cw + pad, s, s);
            ctx.fillRect(k.c * cw + pad, (k.r - 1) * cw + pad, s, s);
            ctx.fillRect(k.c * cw + pad, (k.r + 1) * cw + pad, s, s);
          }
          k.g--;
        }
        else if (k.left > 0) { b = k.dip; k.left--; }
        else if (Math.random() < 0.0045) { k.g = 5; }
        else if (Math.random() < 0.002) { k.dip = k.base * 0.15; k.left = 1 + Math.floor(Math.random() * 3); }
        /* Where the light is passing, the word warms and can be read. */
        var dc = Math.abs(k.c - sweep);
        if (dc < 3 && k.g === 0) { b = Math.min(0.72, b + (3 - dc) * 0.18); col = AMBER; }
      }
      ctx.globalAlpha = b;
      ctx.fillStyle = col;
      ctx.fillRect(k.c * cw + pad, k.r * cw + pad, s, s);
    }
    ctx.globalAlpha = 1;
  }

  function tick(now) {
    if (!running) return;
    raf = requestAnimationFrame(tick);
    if (now - last < 83) return;            /* ~12 fps is plenty for a bitmap */
    last = now; frame++;
    sweep += 0.6; if (sweep > COLS + 6) sweep = -4;   /* one pass ≈ 16 s */
    draw();
  }
  function start() { if (running || reduce || !onScreen || document.hidden) return; running = true; raf = requestAnimationFrame(tick); }
  function stop()  { running = false; cancelAnimationFrame(raf); }

  function boot() {
    sample(); layout(); draw();
    if (reduce) return;
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (es) {
        onScreen = es[0].isIntersecting; onScreen ? start() : stop();
      }, { threshold: 0.05 }).observe(canvas);
    } else { onScreen = true; start(); }
    document.addEventListener('visibilitychange', function () { document.hidden ? stop() : start(); });
    var rt;
    window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { layout(); draw(); }, 120); });
  }
  /* Sample only once the real face is in, or the bitmap is Georgia's. */
  var ready = (document.fonts && document.fonts.load) ? document.fonts.load('20px "Instrument Serif"') : Promise.resolve();
  ready.then(boot, boot);
  if (document.fonts && document.fonts.addEventListener) {
    /* A face that lands after the first paint: sample again, in that face. */
    document.fonts.addEventListener('loadingdone', function () { sample(); layout(); draw(); });
  }
})();
</script>
</body>
</html>
