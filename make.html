/* Light on Light — design tokens
 * Hallmark · route: custom (tuned) · vibe: "warm fog, emerging trace, breathing"
 * axes: light / roman-serif / chromatic-amber ~65°
 * Every colour and font below references a token from this block.
 */

:root {
  /* ---------- Colour · warm fog paper, amber signal ---------- */
  /* Paper is never pure white; every neutral carries chroma toward hue ~68. */
  --color-paper:       oklch(96.5% 0.008 72);   /* 暖雾白 — the page */
  --color-paper-2:     oklch(94%   0.010 70);   /* 雾略沉一层 */
  --color-paper-3:     oklch(90.5% 0.012 68);   /* 雾最浓处 — the thought */

  --color-ink:         oklch(21%   0.012 66);   /* 近黑暖褐 — text, and the entry surface */
  --color-ink-2:       oklch(38%   0.011 64);   /* 次级文字 · 铅笔痕 */
  --color-neutral:     oklch(46%   0.010 66);
  --color-muted:       oklch(52.5% 0.010 66);   /* 弱化文字 — measured 4.92:1 on paper,
                                                 * clears WCAG AA at the 12.8px micro size */

  --color-rule:        oklch(82%   0.010 70);   /* 发丝线 */
  --color-rule-2:      oklch(88%   0.008 70);   /* 更淡的发丝线 */

  /* On the near-black entry surface */
  --color-ink-paper:   oklch(92%   0.010 70);   /* 暗底上的正文 */
  --color-ink-muted:   oklch(66%   0.010 68);   /* 暗底上的弱化文字 */
  --color-ink-rule:    oklch(32%   0.012 66);   /* 暗底上的发丝线 */

  /* 微光 — lighter than paper, so it only reads where the fog is thick.
   * Not a base surface; it is a light source inside the haze. */
  --color-glow:        oklch(99%   0.012 78);

  /* The plate — the illustration's own paper and ink, fixed by the
   * hand-drawn-quote-art skill. Deliberately NOT the site's warm fog: the
   * artworks are a series, and a series' colours are its identity. Every
   * exported gift uses these two values and no others, so a year of them
   * stacks into one body of work. */
  --color-plate-paper: #fdfdfb;
  --color-plate-ink:   #1a1a1a;

  /* The only chromatic colour on the page. Lands once: under the wordmark. */
  --color-accent:      oklch(64%   0.14  65);   /* 琥珀 */
  --color-accent-ink:  oklch(21%   0.012 66);   /* accent L > 50 → 用 ink 作叠字 */
  --color-focus:       oklch(60%   0.19  65);

  /* ---------- Type ---------- */
  /* Two families. Noto Serif SC carries display (200) and body (400);
   * Geist Mono is the single outlier — wordmark + page furniture only. */
  --font-wordmark: "Instrument Serif", ui-serif, Georgia, serif;
  --font-display:  "Noto Serif SC", "Songti SC", ui-serif, Georgia, serif;
  --font-body:     "Noto Serif SC", "Songti SC", ui-serif, Georgia, serif;
  --font-mono:     "Geist Mono", ui-monospace, SFMono-Regular, "SF Mono", monospace;
  /* The skill's handwriting stack, verbatim. System faces only — the plate has
   * to render identically in the browser and on the export canvas, and a
   * webfont would not survive rasterisation the same way. CJK fallbacks are
   * appended because the stack itself carries no Chinese. */
  --font-hand:     "Segoe Print", "Bradley Hand", "Comic Sans MS",
                   "Hanzipen SC", "Yuanti SC", cursive;
  /* --font-display / --font-body carry CJK for the layers behind the opening.
   * The opening itself loads only Instrument Serif + Geist Mono. */

  /* 1.25 major third, floored at 12.8px because CJK dies below that */
  --text-xs:        0.8rem;      /* 12.8px — mono furniture */
  --text-base:      1rem;
  --text-md:        1.25rem;     /* 20px — body */
  --text-lg:        1.5625rem;   /* 25px */
  --text-display-s: clamp(1.6rem, 3.6vw, 2.4414rem);
  --text-display:   clamp(2.75rem, 7vw, 5.25rem);
  --text-wordmark:  clamp(2.3rem, 6.6vw, 5.25rem);   /* the brand, and every page's H1 */
  /* Layer 02's statement + lede sizes. All sit under the 5.5rem display
   * ceiling. Hierarchy is carried by size, colour, and the serif/mono split —
   * Instrument Serif ships one weight, so weight contrast is not on the table. */
  --text-turn:      clamp(2.1rem, 5.2vw, 4rem);
  --text-lede:      clamp(1.15rem, 1.5vw + 0.6rem, 1.6rem);
  /* Layer 03. The greeting leads; the writing line sits quieter beneath it. */
  --text-greet:     clamp(1.5rem, 2.4vw, 2rem);
  --text-write:     clamp(1rem, 1.1vw + 0.5rem, 1.25rem);
  --text-quote:     clamp(1.05rem, 1.1vw + 0.7rem, 1.45rem);

  /* ---------- Space · 4pt scale ---------- */
  --space-3xs: 0.125rem;
  --space-2xs: 0.25rem;
  --space-xs:  0.5rem;
  --space-sm:  0.75rem;
  --space-md:  1rem;
  --space-lg:  1.5rem;
  --space-xl:  2.5rem;
  --space-2xl: 4rem;
  --space-3xl: 6rem;
  --space-4xl: 9rem;

  --page-gutter: clamp(1.25rem, 5vw, 5rem);

  /* ---------- Rules & radii ---------- */
  --rule-hair: 1px;
  --radius-none: 0;
  --radius-plate: 3px;    /* photographs have corners, barely */
  --radius-pill: 999px;   /* the invitation is the one rounded thing here */

  /* Bottom clearance so the fixed invitation can never cover the colophon. */
  --cta-clearance: 7.5rem;

  /* ---------- Motion ---------- */
  --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in:     cubic-bezier(0.7, 0, 0.84, 0);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);

  --dur-micro: 120ms;
  --dur-short: 220ms;
  --dur-long:  420ms;

  /* Weather durations. The opening is paced in seconds, not milliseconds —
   * a deliberate override of Hallmark's ≤500ms reveal / no-loop rules,
   * at the project owner's instruction. */
  --dur-emerge:  4200ms;   /* the field becoming visible */
  --dur-slow:    1600ms;   /* hover — weather, not UI feedback */
  --dur-drift-a: 21s;      /* the haze ground. Coprime-ish periods, so the */
  --dur-drift-b: 27s;      /* composite state never visibly repeats. */
  --dur-drift-c: 34s;
  --dur-breath:  15s;
  --dur-grow:    17s;
  /* The swarm's own timings are randomised per element in JS — see the
   * generator in index.html. These are only the bounds it draws from. */

  /* ---------- Depth ---------- */
  --z-base:   1;
  --z-raised: 10;
  --z-sticky: 200;
}

/* SOURCE FILE — make.html is a single self-contained page and does not link
 * this stylesheet; it embeds a copy. Edit here, then run `python3 build.py`.
 *
 * Hallmark · macrostructure: bespoke (a two-state instrument, not a page)
 *   No catalog shape fits: this is one surface that changes what it is.
 *   State lives on <body data-state>; input / forming / gift are the same
 *   composition at three moments, so nothing jumps when it turns over.
 * nav: masthead (brand is the H1, per the owner's hierarchy note)
 * cta: fixed bottom-right pill — same position, shape and voice as layer 02,
 *   so "Unwrap" and "Export" read as the same hand.
 * theme: custom (inherited, unchanged)
 *
 * TWO-STATE WHITESPACE STRATEGY
 *   input  — the page is almost empty on purpose. One greeting at display
 *            size, one writing line, nothing else. No box, no label, no
 *            counter, no placeholder chrome: a ruled line on paper. The
 *            submit affordance does not exist until there are words to send,
 *            so the empty state has literally nothing to decide about.
 *   gift   — the composition tightens into a mount. The artwork sits in a
 *            plate with the widest margins on the page (a print in a frame
 *            is mostly frame), sentence above it, date beneath. The screen
 *            MIRRORS the export — same order, same proportions, same fixed
 *            template — but is not pixel-identical to it: a print earns more
 *            air around the plate than a screen can afford to give.
 *
 * motion: dissolve · gather · settle  (3 primitives)
 *   No spinner anywhere. The submitted sentence comes apart into the same
 *   motes that layer 01 used, they gather, and the drawing assembles out of
 *   them centre-outward. The wait is the metaphor, so it also covers a real
 *   asynchronous generator if one is ever wired in — `forming` holds
 *   indefinitely until the art is handed over.
 * pre-emit critique: P5 H5 E4 S5 R5 V5
 * contrast: pass (40–41) · mobile: pass (34, 49, 50–57) · tokens: pass (48)
 * v1.0.0
 */

/* ============================================================
   Base
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

html { overflow-x: clip; -webkit-text-size-adjust: 100%; }

body {
  overflow-x: clip;
  margin: 0;
  min-block-size: 100dvh;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-wordmark);
  -webkit-font-smoothing: antialiased;
  display: grid;
  grid-template-rows: auto 1fr auto;   /* mast · stage · footer — footer at the true bottom */
}

h1, h2, p { margin: 0; font-weight: 400; }

.filters { position: absolute; width: 0; height: 0; }

.skip { position: absolute; inset-inline-start: -9999px; font-family: var(--font-mono); font-size: var(--text-xs); }
.skip:focus-visible {
  inset-inline-start: var(--page-gutter); inset-block-start: var(--space-md);
  z-index: var(--z-toast); background: var(--color-ink); color: var(--color-paper);
  padding: var(--space-xs) var(--space-sm);
  outline: 2px solid var(--color-focus); outline-offset: 3px;
}

a:focus-visible,
button:focus-visible,
textarea:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 6px; }

/* ============================================================
   Masthead
   ============================================================ */

.mast {
  display: flex; flex-wrap: wrap;
  justify-content: space-between; align-items: baseline;
  gap: var(--space-sm) var(--space-lg);
  padding: var(--space-2xl) var(--page-gutter) 0;
}
.mast__h {
  font-size: var(--text-wordmark); line-height: 1.02; letter-spacing: -0.008em;
  overflow-wrap: anywhere; min-inline-size: 0;
}
.mast__h a { color: var(--color-ink); text-decoration: none; transition: color var(--dur-short) var(--ease-out); }
.mast__h a:hover { color: var(--color-ink-2); }
.mast__layer {
  font-family: var(--font-mono); font-size: var(--text-xs);
  letter-spacing: 0.24em; color: var(--color-muted); white-space: nowrap;
}

/* ============================================================
   Stage — one surface, three moments
   ============================================================ */

.stage {
  position: relative;
  display: grid;
  align-content: center;
  padding: var(--space-3xl) var(--page-gutter);
}

/* Only one panel is present at a time. `hidden` (not opacity) keeps the
   inactive state out of the tab order and out of the screen reader. */
[data-state="input"]   .panel--gift,
[data-state="forming"] .panel--gift,
[data-state="gift"]    .panel--ask { display: none; }

/* ============================================================
   Input · the ruled line
   ============================================================ */

/* Full width. The greeting runs across the whole page in one small line;
   the ruled line beneath gets the same full width to be written on. */
.ask {
  display: grid;
  gap: var(--space-2xl);
  inline-size: 100%;
}

/* The question leads; the writing line sits quieter beneath it. */
.ask__greet {
  font-size: var(--text-greet);
  line-height: 1.3;
  letter-spacing: 0.01em;
  color: var(--color-ink);
  overflow-wrap: anywhere;
  min-inline-size: 0;
}

/* No box. A line to write on, the way paper has one — and the words sit ON
   the line: single row, no reserved height above, a sliver of padding below.
   `field-sizing: content` lets it grow downward if the thought runs long;
   browsers without it scroll inside the row, which is acceptable. */
.ask__field {
  display: block;
  /* A writing line, not a page-wide rule — long enough for one thought,
     short enough to read as a line you'd put a pen to. */
  inline-size: min(100%, 30rem);
  min-block-size: 1.7em;
  field-sizing: content;
  padding: 0 0 var(--space-2xs);
  border: 0;
  border-block-end: var(--rule-hair) solid var(--color-rule);
  border-radius: 0;
  background: transparent;
  color: var(--color-ink);
  font-family: var(--font-wordmark);
  font-size: var(--text-write);
  line-height: 1.5;
  resize: none;
  transition: border-color var(--dur-long) var(--ease-out);
}
/* The placeholder is the page's only instruction now — it must be readable,
   not decorative. Muted measures 4.92:1 on paper. */
.ask__field::placeholder { color: var(--color-muted); }
.ask__field:hover  { border-block-end-color: var(--color-neutral); }
.ask__field:focus  { outline: none; border-block-end-color: var(--color-ink-2); }
.ask__field:focus-visible { outline: none; }
/* Keyboard users still get a ring — on the line, not around the box. */
.ask__field:focus-visible { border-block-end: 2px solid var(--color-focus); }

.ask__foot {
  display: flex; flex-wrap: wrap; align-items: baseline;
  gap: var(--space-md) var(--space-lg);
  min-block-size: 1.6em;   /* reserved, so nothing shifts when the verb appears */
}

/* The verb does not exist until there is something to send. */
.ask__go {
  appearance: none;
  border: 0; background: none; padding: 0;
  font-family: var(--font-wordmark);
  font-size: var(--text-md);
  color: var(--color-ink);
  cursor: pointer;
  white-space: nowrap;
  border-block-end: var(--rule-hair) solid var(--color-accent);
  padding-block-end: 2px;
  opacity: 0;
  visibility: hidden;
  transition: opacity var(--dur-long) var(--ease-out),
              border-color var(--dur-short) var(--ease-out);
}
.ask__go:disabled { cursor: default; }
[data-ready="yes"] .ask__go { opacity: 1; visibility: visible; }
.ask__go:hover:not(:disabled) { border-block-end-color: var(--color-ink); }

.ask__hint {
  font-family: var(--font-mono); font-size: var(--text-xs);
  letter-spacing: 0.1em; color: var(--color-muted);
}

/* ============================================================
   Forming · dissolve → gather. No spinner, ever.
   The sentence comes apart into the motes layer 01 used, they draw
   together, and the artwork assembles out of them.
   ============================================================ */

.forming {
  position: absolute;
  inset: 0;
  z-index: var(--z-raised);
  display: none;
  place-items: center;
  align-content: center;
  gap: var(--space-lg);
  pointer-events: none;
}
[data-state="forming"] .forming { display: grid; }

.forming__field { position: absolute; inset: 0; overflow: clip; }

.spark {
  position: absolute;
  inset-inline-start: var(--x);
  inset-block-start: var(--y);
  inline-size: var(--s);
  block-size: var(--s);
  background: var(--c);
  opacity: 0;
  /* travels from where its word was toward the centre of the plate */
  animation: gather var(--t) var(--ease-in-out) var(--d) infinite;
}
@keyframes gather {
  0%   { opacity: 0;        transform: translate(0, 0) scale(1); }
  14%  { opacity: var(--o); transform: translate(calc(var(--gx) * 0.2), calc(var(--gy) * 0.2)) scale(1); }
  76%  { opacity: var(--o); transform: translate(calc(var(--gx) * 0.92), calc(var(--gy) * 0.92)) scale(0.7); }
  100% { opacity: 0;        transform: translate(var(--gx), var(--gy)) scale(0.4); }
}

.forming__echo {
  position: relative;
  max-inline-size: 24ch;
  font-size: var(--text-md);
  line-height: 1.5;
  color: var(--color-muted);
  text-align: center;
  animation: echo-out 2.4s var(--ease-in-out) forwards;
}
@keyframes echo-out { to { opacity: 0.28; } }

/* One quiet mono note under the dissolving sentence, breathing slowly —
   the same furniture voice as LAYER 03 and the date stamp. */
.forming__note {
  position: relative;
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: 0.24em;
  color: var(--color-muted);
  animation: note-breathe 2s var(--ease-in-out) infinite alternate;
}
@keyframes note-breathe { to { opacity: 0.35; } }

/* ============================================================
   Gift · the mount. A print is mostly frame.
   The screen layout below IS the export layout, at another scale.
   ============================================================ */

.gift {
  display: grid;
  justify-items: center;
  gap: var(--space-lg);
  /* Bounded by viewport HEIGHT as well as width: a gift you have to scroll to
     see whole is not a gift. The plate is square, so its height is its width. */
  inline-size: min(100%, 34rem, 52dvh);
  margin-inline: auto;
  /* settle: the whole mount arrives once, slowly, and then stops */
  animation: settle-in 1.1s var(--ease-out) both;
}
@keyframes settle-in { from { opacity: 0; transform: translateY(10px); } }

.gift__line {
  font-family: var(--font-hand);
  font-size: var(--text-quote);
  line-height: 1.42;
  text-align: center;
  color: var(--color-plate-ink);
  max-inline-size: 24ch;
  overflow-wrap: anywhere;
  min-inline-size: 0;
  transform: rotate(-0.7deg);   /* the skill's hand-set tilt, once, not per word */
}

/* The plate keeps the skill's own paper and ink, not the site's. That is
   deliberate: the illustration belongs to a series that has to stay
   recognisable across a year of them, and the series' colours are its
   identity. The page is the room; the plate is the picture. */
.gift__plate {
  inline-size: 100%;
  aspect-ratio: 1;
  background: var(--color-plate-paper);
  border: var(--rule-hair) solid var(--color-rule);
  border-radius: var(--radius-plate);
  overflow: hidden;
}
.gift__plate svg { display: block; inline-size: 100%; block-size: 100%; }

/* Elements assemble centre-outward rather than all at once. */
.gift__plate [data-i] {
  opacity: 0;
  animation: assemble 900ms var(--ease-out) both;
  animation-delay: calc(240ms + var(--i) * 110ms);
  transform-box: fill-box;
  transform-origin: center;
}
@keyframes assemble { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: none; } }

.gift__meta {
  display: grid;
  justify-items: center;
  gap: var(--space-xs);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: 0.24em;
  color: var(--color-muted);
  text-align: center;
}
.gift__rule {
  inline-size: var(--space-xl);
  block-size: var(--rule-hair);
  background: var(--color-rule);
  margin-block-end: var(--space-2xs);
}

/* Which hand drew it. Small, honest, always present. */
.gift__via {
  font-size: var(--text-xs);
  letter-spacing: 0.18em;
  color: var(--color-muted);
}

.gift__again {
  appearance: none; border: 0; background: none; padding: 0;
  font-family: var(--font-mono); font-size: var(--text-xs);
  letter-spacing: 0.14em; color: var(--color-muted);
  cursor: pointer; white-space: nowrap;
  border-block-end: var(--rule-hair) solid transparent;
  transition: color var(--dur-short) var(--ease-out),
              border-color var(--dur-short) var(--ease-out);
}
.gift__again:hover { color: var(--color-ink); border-block-end-color: var(--color-rule); }

/* ============================================================
   The fixed invitation — same corner, shape and voice as layer 02
   ============================================================ */

.cta {
  position: fixed;
  inset-block-end: var(--space-xl);
  inset-inline-end: var(--page-gutter);
  z-index: var(--z-sticky);
  display: none;
  align-items: center;
  gap: var(--space-sm);
  min-block-size: 52px;
  padding: var(--space-md) var(--space-xl);
  appearance: none;
  border: var(--rule-hair) solid transparent;
  border-radius: var(--radius-pill);
  background: var(--color-accent);
  color: var(--color-accent-ink);
  font-family: var(--font-wordmark);
  font-size: var(--text-lg);
  line-height: 1;
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
  transition: background-color var(--dur-short) var(--ease-out),
              transform 110ms var(--ease-out);
}
[data-state="gift"] .cta { display: inline-flex; }
.cta::after {
  content: "";
  inline-size: 0.6em; block-size: 0.6em;
  border-inline-end: 2px solid currentColor;
  border-block-end: 2px solid currentColor;
  transform: translateY(-2px) rotate(45deg);
  transition: transform var(--dur-short) var(--ease-out);
}
.cta:hover, .cta:focus-visible { background: var(--color-focus); }
.cta:hover::after, .cta:focus-visible::after { transform: translateY(1px) rotate(45deg); }
.cta:active { transform: translateY(1px); }

/* ============================================================
   Footer
   ============================================================ */

.colophon {
  display: flex; flex-wrap: wrap;
  gap: var(--space-sm) var(--space-lg); align-items: baseline;
  margin-inline: var(--page-gutter);
  padding-block: var(--space-lg) var(--space-lg);
  border-block-start: var(--rule-hair) solid var(--color-rule);
  font-family: var(--font-mono); font-size: var(--text-xs);
  letter-spacing: 0.12em; color: var(--color-muted);
}
/* Only the gift state shows the fixed Export pill — only then does the footer
   need to clear it. In the input state the page ends at the footer, full stop. */
[data-state="gift"] .colophon { padding-block-end: var(--cta-clearance); }
.colophon__sep { color: var(--color-rule); }
.colophon a {
  color: var(--color-muted); text-decoration: none; white-space: nowrap;
  border-block-end: var(--rule-hair) solid transparent;
  transition: color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out);
}
.colophon a:hover { color: var(--color-ink); border-block-end-color: var(--color-rule); }

/* Live region for the state changes — announced, never drawn. */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ============================================================
   ≤ 40rem
   ============================================================ */

@media (max-width: 40rem) {
  .stage { padding-block: var(--space-2xl); }
  .cta {
    font-size: var(--text-base); min-block-size: 44px;
    padding: var(--space-sm) var(--space-lg);
    inset-block-end: var(--space-lg);
  }
  .cta::after { inline-size: 0.52em; block-size: 0.52em; }
}

/* ============================================================
   Reduced motion — the gift is simply there, fully formed.
   ============================================================ */

@media (prefers-reduced-motion: reduce) {
  .gift, .gift__plate [data-i], .spark, .forming__echo, .forming__note {
    animation: none !important;
    opacity: 1;
    transform: none !important;
  }
  .cta, .cta::after, .ask__field, .ask__go { transition: none; }
}

</style>
</head>
<body>

<a class="skip" href="#field">Skip to writing</a>

<header class="mast">
  <h1 class="mast__h"><a href="./index.html">Light on Light</a></h1>
  <p class="mast__layer">LAYER 03 &mdash; YOUR VISUAL GIFT</p>
</header>

<main class="stage">

  <!-- INPUT -->
  <section class="panel panel--ask">
    <form class="ask" id="ask" autocomplete="off">
      <h2 class="ask__greet">What passed through your mind today?</h2>
      <label class="sr" for="field">Your thought</label>
      <textarea class="ask__field" id="field" name="thought" rows="1" maxlength="180"
                placeholder="Please type here, one sentence is enough"></textarea>
      <div class="ask__foot">
        <button class="ask__go" id="go" type="submit" disabled>Translate it</button>
      </div>
    </form>
  </section>

  <!-- FORMING — no spinner. The sentence comes apart and gathers,
       with one quiet mono note saying what is happening. -->
  <div class="forming" aria-hidden="true">
    <div class="forming__field" id="sparks"></div>
    <p class="forming__echo" id="echo"></p>
    <p class="forming__note">GENERATING&hellip;</p>
  </div>

  <!-- GIFT -->
  <section class="panel panel--gift">
    <figure class="gift" id="gift">
      <figcaption class="gift__line" id="giftLine"></figcaption>
      <div class="gift__plate" id="plate" role="img" aria-label="A hand-drawn illustration made from your sentence"></div>
      <div class="gift__meta">
        <span class="gift__rule" aria-hidden="true"></span>
        <span id="giftDate"></span>
        <span class="gift__via" id="giftVia"></span>
        <button class="gift__again" id="again" type="button">WRITE ANOTHER</button>
      </div>
    </figure>

  </section>

</main>

<button class="cta" id="export" type="button">Export</button>

<p class="sr" id="live" role="status" aria-live="polite"></p>

<footer class="colophon">
  <span>Light on Light</span>
  <span class="colophon__sep" aria-hidden="true">&middot;</span>
  <span>Layer 03</span>
  <span class="colophon__sep" aria-hidden="true">&middot;</span>
  <a href="./concept.html">Why this project</a>
</footer>

<script>
/* ============================================================================
   Layer 03 — the instrument.

   WHAT THIS IS, HONESTLY
   `hand-drawn-quote-art` is a Claude Code skill: it runs in an agent, not in a
   browser, so this page cannot call it. What it does instead is carry the
   skill's METHOD across — the anchor-word extraction, the three-mode priority,
   and the whole visual specification (ink #1a1a1a on paper #fdfdfb, the
   handwriting stack, dashes instead of solid strokes, irregular beziers,
   1–2 degrees of tilt, one or two elements and no more, a 680 square).

   The judgement is therefore a lookup, not an LLM's reading. It is good on the
   concrete words people actually reach for and plain on the ones it has never
   seen — where it falls back to Mode 1, exactly as the skill instructs. The
   studio chain above it (Claude locally, Gemini in the cloud) is the real
   thing; this generator is the always-there floor beneath both.

   SEEDED, NOT RANDOM
   Every random draw comes from a hash of your sentence. The same thought
   always makes the same picture. A gift should be determined by the thing it
   is a gift about.
   ============================================================================ */
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var body = document.body;

  /* ---------- seeded randomness ---------- */
  function hash(str) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }
  function rngFrom(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ---------- the skill's step 2: find a visual anchor ----------
     Not the most important word — the one that can become a shape. */
  var STOP = ('a an the and or but if of to in on at for with from into over '
    + 'is am are was were be been being do does did done have has had i me my '
    + 'you your he she it we they them this that these those there here what '
    + 'when where why how not no yes so as by up out just very really some any '
    + 'about would could should will can may might must its it’s '
    + "i'm i’m i've i’ve don't don’t didn't didn’t isn't isn’t it's can't can’t "
    + "won't won’t you're you’re that's that’s there's there’s").split(' ');

  /* Crude, deliberately: enough to see through a plural or a tense so that
     "bleeds" reaches the pun list that only knows "bleed". A real stemmer
     would be more than this lookup deserves. */
  function stems(w) {
    var out = [w];
    if (/ies$/.test(w)) out.push(w.slice(0, -3) + 'y');
    if (/ing$/.test(w)) { out.push(w.slice(0, -3)); out.push(w.slice(0, -3) + 'e'); }
    if (/ed$/.test(w))  { out.push(w.slice(0, -2)); out.push(w.slice(0, -1)); }
    if (/e?s$/.test(w)) { out.push(w.replace(/e?s$/, '')); out.push(w.slice(0, -1)); }
    return out;
  }

  /* word -> shape. Each shape is a drawing the skill would recognise. */
  var ANCHOR = {
    rings:   'attention focus centre center notice listen watch quiet still hold wait patience present ' +
             'aware awake careful care mind minds mindful concentrate around circle',
    bleed:   'bleed spread soak leak seep spill ink stain blur everything through spreads bleeds ' +
             'saturate flood pour drown wash',
    spiral:  'again return world back repeat cycle turn spin round loop memory remember returning ' +
             'circles orbit endless forever begin beginning start',
    sprout:  'grow grows growing plant plants seed seeds root roots tree leaf leaves bloom flower ' +
             'garden spring alive become becoming green branch',
    horizon: 'space room breathe breath sea ocean sky far distance horizon alone empty quiet ' +
             'silence wide open outside field air light morning',
    thread:  'thread path way line walk road journey follow lost find story trail wander drift ' +
             'route trace connect between across poem poems word words song songs letter ' +
             'sentence write writing wrote read reading language name',
    scatter: 'forget forgot scatter gone lose lost disappear fade vanish leave leaving fleeting ' +
             'moment brief passing slip escape almost never',
    weight:  'weight heavy carry hold burden load lift press down pull gravity anchor sink deep'
  };

  /* Words with a literal AND a figurative sense — the skill's Mode 2, its
     highest-priority mode. Drawing the literal one and letting the reader
     arrive at the other is where this style earns its keep. */
  var PUNS = ('bleed grow root plant weight light hold break drift seed spark thread anchor bloom '
    + 'fall reach current shadow space run fold carry water burn sink float land ground touch').split(' ');

  /* Mode 3 fires when the sentence sets two things against each other. */
  var CONTRAST_MARKS = [' but ', ' yet ', ' versus ', ' vs ', ' instead of ', ' rather than ',
                        ' and not ', ' or ', ' between '];

  /* The same maps for Chinese. There are no spaces to split on, so these are
     matched as substrings of the whole sentence; the longest hit per shape
     wins, and longer hits beat shorter ones across shapes (清晨 beats 光).
     Without this table every Chinese sentence missed every anchor and fell
     into the same default rings — a wall of near-identical gifts. */
  var ANCHOR_ZH = {
    rings:   '专注 注意 倾听 聆听 安静 宁静 平静 耐心 等待 当下 中心 凝视 目光 守护 陪伴 圆 环',
    bleed:   '晕开 蔓延 弥漫 淹没 流淌 渗 墨 染 浸 洇',
    spiral:  '重复 循环 旋转 回来 回去 记忆 回忆 永远 又一次 再一次 开始 轮回 归 绕',
    sprout:  '生长 成长 种子 种下 扎根 开花 发芽 生命 成为 长出 根 树 叶 花 春 绿 枝',
    horizon: '呼吸 大海 天空 远方 距离 地平线 孤独 独自 空旷 辽阔 田野 清晨 阳光 黎明 自由 海 风 光 晨',
    thread:  '旅程 旅行 跟随 迷路 寻找 找到 故事 文字 句子 语言 名字 连接 线 路 诗 字 词 歌 信 写 读 桥',
    scatter: '忘记 遗忘 散落 消失 淡去 逝去 离开 瞬间 短暂 溜走 错过 飘散 流逝 来不及',
    weight:  '重量 沉重 背负 负担 举起 下沉 深处 放下 扛 压 锚'
  };
  var PUNS_ZH = '光 重 根 线 沉 深 流 落 散 长 断 种 背 转 空 浮 烧 触 折'.split(' ');
  var CONTRAST_ZH = ['但', '却', '而是', '而不是', '与其', '宁可', '宁愿', '还是', '可是',
                     '然而', '反而', '不如'];

  function candsZH(text) {
    var out = [];
    for (var key in ANCHOR_ZH) {
      var list = ANCHOR_ZH[key].split(' ');
      var best = null;
      for (var i = 0; i < list.length; i++) {
        if (text.indexOf(list[i]) > -1 && (!best || list[i].length > best.length)) best = list[i];
      }
      if (best) {
        out.push({ word: best, shape: key,
                   pun: PUNS_ZH.some(function (p) { return best.indexOf(p) > -1; }) });
      }
    }
    out.sort(function (a, b) { return b.word.length - a.word.length; });
    return out;
  }

  function words(text) {
    return text.toLowerCase().replace(/[^\p{L}\p{N}\s'’]/gu, ' ')
               .split(/\s+/).filter(Boolean);
  }

  function analyse(text) {
    var w = words(text);
    var meaty = w.filter(function (x) { return STOP.indexOf(x) === -1 && x.length > 2; });

    /* Collect every word that maps to a shape, then choose.
       The skill puts Mode 2 first — "命中就优先用" — so a word with a double
       sense beats an earlier word without one. Scanning left-to-right and
       taking the first hit gets "Writing bleeds into everything" wrong: it
       lands on `writing` and throws away the pun the whole line is built on. */
    var cands = [];
    for (var i = 0; i < meaty.length; i++) {
      var forms = stems(meaty[i]);
      for (var key in ANCHOR) {
        var list = ANCHOR[key].split(' ');
        if (forms.some(function (f) { return list.indexOf(f) > -1; })) {
          cands.push({ word: meaty[i], shape: key,
                       pun: forms.some(function (f) { return PUNS.indexOf(f) > -1; }) });
          break;
        }
      }
    }
    if (/[一-鿿]/.test(text)) { cands = cands.concat(candsZH(text)); }
    var chosen = cands.filter(function (c) { return c.pun; })[0] || cands[0] || null;
    var anchor = chosen ? chosen.word : null;
    var shape  = chosen ? chosen.shape : null;

    var lower = ' ' + text.toLowerCase() + ' ';
    var hasContrast = CONTRAST_MARKS.some(function (m) { return lower.indexOf(m) > -1; })
                   || CONTRAST_ZH.some(function (m) { return text.indexOf(m) > -1; });
    var isPun = !!(chosen && chosen.pun);

    /* The skill's priority order, checked in order: 2 beats 3 beats 1. */
    var mode = isPun ? 2 : (hasContrast ? 3 : 1);
    if (!shape) { shape = 'rings'; }          /* Mode 1 is the fallback, per the skill */
    if (mode === 3) { shape = 'contrast'; }

    return { anchor: anchor || (meaty[0] || 'thought'), shape: shape, mode: mode };
  }

  /* ---------- hand-drawn primitives ----------
     Regular geometry reads as a UI icon. Everything below is nudged
     off-true on purpose: broken strokes, asymmetric control points. */
  var INK = '#1a1a1a';

  function jitterPath(pts, r, amt) {
    var d = '';
    for (var i = 0; i < pts.length; i++) {
      var x = pts[i][0] + (r() - 0.5) * amt;
      var y = pts[i][1] + (r() - 0.5) * amt;
      if (i === 0) { d += 'M' + x.toFixed(1) + ' ' + y.toFixed(1); }
      else {
        var px = pts[i - 1][0], py = pts[i - 1][1];
        var cx = (px + x) / 2 + (r() - 0.5) * amt * 1.6;
        var cy = (py + y) / 2 + (r() - 0.5) * amt * 1.6;
        d += ' Q' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + x.toFixed(1) + ' ' + y.toFixed(1);
      }
    }
    return d;
  }
  function stroke(d, w, dash) {
    return '<path d="' + d + '" fill="none" stroke="' + INK + '" stroke-width="' + w +
           '" stroke-linecap="round"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>';
  }
  function dot(x, y, r) {
    return '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r.toFixed(1) + '" fill="' + INK + '"/>';
  }
  function blob(cx, cy, rad, r) {
    var pts = [], n = 13;
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2;
      var rr = rad * (0.74 + r() * 0.46);
      pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
    }
    pts.push(pts[0]);
    return '<path d="' + jitterPath(pts, r, 8) + ' Z" fill="' + INK + '"/>';
  }

  /* ---------- the eight drawings ---------- */
  var SHAPES = {
    rings: function (r) {
      var out = [], n = 4 + Math.floor(r() * 2);
      for (var i = 0; i < n; i++) {
        var rad = 58 + i * (44 + r() * 14);
        out.push('<circle cx="340" cy="352" r="' + rad.toFixed(0) + '" fill="none" stroke="' + INK +
                 '" stroke-width="2.2" stroke-dasharray="' + (3 + i) + ' ' + (9 + i) + '"/>');
      }
      out.push(dot(340, 352, 4.5));
      return out;
    },
    bleed: function (r) {
      var out = [blob(340, 340, 104, r)];
      var n = 14 + Math.floor(r() * 6);
      for (var i = 0; i < n; i++) {
        var a = r() * Math.PI * 2, d = 165 + r() * 250;
        out.push(dot(340 + Math.cos(a) * d, 340 + Math.sin(a) * d * 0.88, 2 + r() * 4.5));
      }
      return out;
    },
    spiral: function (r) {
      var pts = [], turns = 3.2 + r() * 0.9;
      for (var i = 0; i <= 130; i++) {
        var t = i / 130, a = t * Math.PI * 2 * turns, rad = 16 + t * 236;
        pts.push([340 + Math.cos(a) * rad, 344 + Math.sin(a) * rad]);
      }
      return [stroke(jitterPath(pts, r, 3), 2.2, '5 9'), dot(340, 344, 4)];
    },
    sprout: function (r) {
      var stem = [];
      for (var i = 0; i <= 10; i++) {
        var t = i / 10;
        stem.push([340 + Math.sin(t * 2.3) * 40, 588 - t * 452]);
      }
      var out = [stroke(jitterPath(stem, r, 5), 2.6, null)];
      for (var k = 0; k < 3; k++) {
        var y = 470 - k * 132, dir = k % 2 ? 1 : -1;
        var leaf = [[340, y], [340 + dir * 92, y - 48], [340 + dir * 158, y - 8],
                    [340 + dir * 74, y + 30], [340, y]];
        out.push(stroke(jitterPath(leaf, r, 7), 2.2, '4 9'));
      }
      out.push(dot(340, 596, 5));
      return out;
    },
    horizon: function (r) {
      var line = [];
      for (var i = 0; i <= 10; i++) { line.push([70 + i * 54, 430]); }
      var out = [stroke(jitterPath(line, r, 5), 2.2, null)];
      out.push(stroke(jitterPath([[340, 430], [338, 352], [342, 286]], r, 6), 2, '4 10'));
      for (var i = 0; i < 7; i++) {
        out.push(dot(140 + r() * 400, 180 + r() * 150, 2 + r() * 3));
      }
      return out;
    },
    thread: function (r) {
      var pts = [];
      for (var i = 0; i <= 16; i++) {
        var t = i / 16;
        pts.push([90 + t * 500, 380 + Math.sin(t * 5.4) * 122]);
      }
      var out = [stroke(jitterPath(pts, r, 7), 2.2, '6 10')];
      out.push('<circle cx="' + (90 + 0.62 * 500).toFixed(0) + '" cy="' +
               (380 + Math.sin(0.62 * 5.4) * 122).toFixed(0) +
               '" r="15" fill="none" stroke="' + INK + '" stroke-width="2.2"/>');
      return out;
    },
    scatter: function (r) {
      var out = [blob(238, 356, 40, r)];
      var n = 20 + Math.floor(r() * 8);
      for (var i = 0; i < n; i++) {
        var t = i / n;
        out.push(dot(268 + t * 330 + (r() - 0.5) * 60,
                     356 + (r() - 0.5) * 250 * t + 10, Math.max(1.4, 6 * (1 - t))));
      }
      return out;
    },
    weight: function (r) {
      var out = [blob(340, 470, 116, r)];
      for (var i = 0; i < 6; i++) {
        var y = 292 - i * 46;
        out.push(stroke(jitterPath([[196 - i * 20, y], [484 + i * 20, y]], r, 5), 2.2,
                        (3 + i) + ' ' + (8 + i)));
      }
      return out;
    },
    /* Mode 3 — one eye looking at two kinds of thing. */
    contrast: function (r) {
      var out = [];
      for (var i = 0; i <= 5; i++) {
        out.push(stroke(jitterPath([[76, 196 + i * 60], [286, 196 + i * 60]], r, 2), 1.6, '2 6'));
        out.push(stroke(jitterPath([[76 + i * 42, 196], [76 + i * 42, 496]], r, 2), 1.6, '2 6'));
      }
      out.push(stroke(jitterPath([[340, 168], [336, 300], [344, 420], [338, 528]], r, 7), 2, '4 9'));
      var sc = [];
      for (var k = 0; k <= 22; k++) {
        var t = k / 22;
        sc.push([420 + Math.sin(t * 11) * 88 + t * 70, 250 + Math.cos(t * 8.5) * 96 + t * 40]);
      }
      out.push(stroke(jitterPath(sc, r, 9), 2.2, null));
      return out;
    }
  };

  /* ---------- assemble the plate ---------- */
  function draw(text) {
    var a = analyse(text);
    var r = rngFrom(hash(text.trim().toLowerCase()));
    var parts = SHAPES[a.shape](r);
    var tilt = (r() * 2 - 1) * 1.4;                    /* the skill's 1–2 degrees, once */
    var inner = parts.map(function (p, i) {
      return p.replace(/^<(\w+)/, '<$1 data-i style="--i:' + i + '"');
    }).join('');
    var svg =
      '<svg viewBox="0 0 680 680" role="img" xmlns="http://www.w3.org/2000/svg">' +
      '<rect x="0" y="0" width="680" height="680" fill="#fdfdfb"/>' +
      '<g transform="rotate(' + tilt.toFixed(2) + ' 340 340)">' + inner + '</g></svg>';
    return { svg: svg, meta: a };
  }

  /* ---------- state ---------- */
  var field = $('field'), go = $('go'), live = $('live'), form = $('ask');
  var current = { text: '', date: '' };

  function setState(s) {
    body.dataset.state = s;
    if (s === 'forming') { live.textContent = 'Translating your sentence.'; }
    if (s === 'gift') { live.textContent = 'Your gift is ready. Export saves it as a JPG.'; }
  }

  field.addEventListener('input', function () {
    body.dataset.ready = field.value.trim().length > 1 ? 'yes' : 'no';
    go.disabled = field.value.trim().length < 2;
  });
  /* Enter sends; Shift+Enter makes a new line. */
  field.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  function stamp(d) {
    var M = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY',
             'AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
    return String(d.getDate()).padStart(2, '0') + ' ' + M[d.getMonth()] + ' ' + d.getFullYear();
  }

  /* ---------- forming: dissolve, then gather. No spinner. ---------- */
  function sow(text) {
    var host = $('sparks');
    host.textContent = '';
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return;
    var r = rngFrom(hash(text) ^ 0x9e37);
    var n = Math.min(52, 16 + text.length);
    var frag = document.createDocumentFragment();
    for (var i = 0; i < n; i++) {
      var s = document.createElement('span');
      s.className = 'spark';
      var x = 8 + r() * 84, y = 26 + r() * 48;
      s.style.setProperty('--x', x.toFixed(2) + '%');
      s.style.setProperty('--y', y.toFixed(2) + '%');
      /* everything travels toward the middle, where the plate will be */
      s.style.setProperty('--gx', ((50 - x) * 0.9).toFixed(2) + 'vw');
      s.style.setProperty('--gy', ((50 - y) * 0.62).toFixed(2) + 'vh');
      s.style.setProperty('--s', (1.6 + r() * 3.6).toFixed(2) + 'px');
      s.style.setProperty('--o', (0.2 + r() * 0.5).toFixed(2));
      s.style.setProperty('--c', r() < 0.16 ? 'var(--color-accent)' : 'var(--color-ink-2)');
      s.style.setProperty('--t', (2.6 + r() * 2.4).toFixed(2) + 's');
      s.style.setProperty('--d', (-r() * 4).toFixed(2) + 's');
      frag.appendChild(s);
    }
    host.appendChild(frag);
  }

  /* Injected markup is injected markup, whoever drew it. */
  function sanitizeSVG(raw) {
    return raw
      .replace(/<script[\s\S]*?<\/script>/gi, '')
      .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '')
      .replace(/javascript:/gi, '');
  }

  function present(text, art) {
    var d = new Date();
    current.text = text;
    current.date = stamp(d);
    $('giftLine').textContent = text;          /* textContent, never innerHTML */
    var plate = $('plate');
    plate.innerHTML = art.svg;
    /* Assemble centre-outward whoever drew it: deal data-i to the top-level
       strokes so the CSS stagger also applies to SVGs that arrive without it. */
    var root = plate.querySelector('svg');
    if (root) {
      var host = root.querySelector('g') || root;
      var idx = 0;
      Array.prototype.forEach.call(host.children, function (el) {
        if (el.tagName.toLowerCase() === 'rect') return;
        el.setAttribute('data-i', '');
        el.style.setProperty('--i', idx++);
      });
    }
    /* Left on the element on purpose: who drew it, and (for local draws)
       which anchor and mode fired. Inspectable rather than mysterious. */
    plate.dataset.via = art.via;
    if (art.meta) {
      plate.dataset.anchor = art.meta.anchor;
      plate.dataset.mode = String(art.meta.mode);
      plate.dataset.shape = art.meta.shape;
    }
    $('giftDate').textContent = current.date;
    /* One universal stamp — the gift is signed by the project, not the
       engine. Which hand actually drew it stays recorded on
       plate.dataset.via (claude / gemini / local) for anyone who inspects. */
    $('giftVia').textContent = 'DRAWN BY \u201CLight on Light\u201D';
    setState('gift');
  }

  /* The real skill, through the studio server (server.py → claude -p).
     The studio can live in two places, tried in order:
       1. same origin — server.py locally, or a serverless deploy
       2. the owner's own machine at http://localhost:4180 — browsers treat
          localhost as a trustworthy origin, so even the HTTPS public page
          may call it; server.py's CORS allowlist decides who is let in.
     So the owner opens the public site with server.py running and gifts are
     drawn by Claude on her own login; every other visitor quietly falls
     through to the cloud studio or the built-in generator. The forming state holds as long
     as it takes; there is no spinner to lie with, only the gathering. */
  function callStudio(url, text) {
    var ctrl = new AbortController();
    var kill = setTimeout(function () { ctrl.abort(); }, 160000);
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text }),
      signal: ctrl.signal
    }).then(function (r) {
      clearTimeout(kill);
      if (!r.ok) throw new Error('studio ' + r.status);
      return r.json();
    }).then(function (j) {
      if (!j.svg || j.svg.indexOf('<svg') !== 0) throw new Error('no svg');
      return { svg: sanitizeSVG(j.svg), via: j.via || 'claude', meta: null };
    });
  }

  /* Three studios, tried in order:
       1. same origin            — server.py locally, or the Vercel site itself
       2. the owner's machine    — localhost:4180 → her own Claude login
       3. the cloud              — the Vercel function → Gemini Flash
     So the owner's Claude wins when her server is up; everyone else still
     gets an LLM-drawn gift from the cloud; and only if all three are down
     does the built-in generator take over. */
  function askClaude(text) {
    var home = 'http://localhost:4180';
    var cloud = 'https://light-on-light.vercel.app';
    return callStudio('/api/translate', text)['catch'](function (err) {
      if (window.location.origin === home) throw err;   /* already tried it */
      return callStudio(home + '/api/translate', text);
    })['catch'](function (err) {
      if (window.location.origin === cloud) throw err;  /* already tried it */
      return callStudio(cloud + '/api/translate', text);
    });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = field.value.trim().replace(/\s+/g, ' ');
    if (text.length < 2) return;

    $('echo').textContent = text;
    sow(text);
    setState('forming');

    /* Claude first; the built-in generator only when the studio is
       unreachable (double-clicked file, CLI missing, timeout). The gift
       always says which hand drew it. */
    var art = askClaude(text)['catch'](function () {
      var local = draw(text);
      return { svg: local.svg, via: 'local', meta: local.meta };
    });
    var floor = new Promise(function (res) { setTimeout(res, 2600); });
    Promise.all([art, floor]).then(function (v) { present(text, v[0]); });
  });

  $('again').addEventListener('click', function () {
    field.value = '';
    body.dataset.ready = 'no';
    go.disabled = true;
    setState('input');
    field.focus();
  });

  /* ---------- export ----------
     ONE fixed template, always. Same ground, same plate, same margins, same
     date position, same type. That is what makes a year of these read as one
     body of work instead of a folder of unrelated pictures. */
  var CARD = { w: 1080, h: 1400, scale: 2 };

  function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

  function wrap(ctx, text, maxW) {
    var out = [], line = '', w = text.split(' ');
    for (var i = 0; i < w.length; i++) {
      var test = line ? line + ' ' + w[i] : w[i];
      if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w[i]; }
      else { line = test; }
    }
    if (line) out.push(line);
    return out.slice(0, 4);
  }

  $('export').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true;
    var svgMarkup = $('plate').innerHTML;
    var blobUrl = URL.createObjectURL(new Blob([svgMarkup], { type: 'image/svg+xml;charset=utf-8' }));
    var img = new Image();

    img.onload = function () {
      var c = document.createElement('canvas');
      c.width = CARD.w * CARD.scale;
      c.height = CARD.h * CARD.scale;
      var ctx = c.getContext('2d');
      ctx.scale(CARD.scale, CARD.scale);

      /* ground — the site's warm paper; the plate is a print in a mount */
      ctx.fillStyle = cssVar('--color-paper') || '#f7f3ee';
      ctx.fillRect(0, 0, CARD.w, CARD.h);

      /* the sentence, in the skill's hand, tilted once */
      ctx.save();
      ctx.translate(CARD.w / 2, 0);
      ctx.rotate(-0.7 * Math.PI / 180);
      ctx.fillStyle = cssVar('--color-plate-ink') || '#1a1a1a';
      ctx.textAlign = 'center';
      ctx.font = '40px ' + (cssVar('--font-hand') || 'cursive');
      var lines = wrap(ctx, current.text, CARD.w - 220);
      var top = 156 - (lines.length - 1) * 27;
      lines.forEach(function (l, i) { ctx.fillText(l, 0, top + i * 54); });
      ctx.restore();

      /* the plate. 156 above the sentence, 88 below the series mark: the card
         sits INTO itself rather than floating in the middle of its own frame. */
      var P = { x: 140, y: 300, s: 800 };
      ctx.fillStyle = cssVar('--color-plate-paper') || '#fdfdfb';
      ctx.fillRect(P.x, P.y, P.s, P.s);
      ctx.drawImage(img, P.x, P.y, P.s, P.s);
      ctx.strokeStyle = cssVar('--color-rule') || '#d8d2c8';
      ctx.lineWidth = 1;
      ctx.strokeRect(P.x + 0.5, P.y + 0.5, P.s - 1, P.s - 1);

      /* rule, date, series mark */
      ctx.fillStyle = cssVar('--color-rule') || '#d8d2c8';
      ctx.fillRect(CARD.w / 2 - 20, 1218, 40, 1);
      ctx.textAlign = 'center';
      ctx.fillStyle = cssVar('--color-ink-2') || '#4a443c';
      ctx.font = '17px ' + (cssVar('--font-mono') || 'monospace');
      ctx.fillText(spaced(current.date), CARD.w / 2, 1270);
      ctx.fillStyle = cssVar('--color-muted') || '#7d766b';
      ctx.font = '14px ' + (cssVar('--font-mono') || 'monospace');
      ctx.fillText(spaced('LIGHT ON LIGHT'), CARD.w / 2, 1312);

      var a = document.createElement('a');
      a.download = 'light-on-light-' + isoDay() + '.jpg';
      a.href = c.toDataURL('image/jpeg', 0.92);
      a.click();
      URL.revokeObjectURL(blobUrl);
      btn.disabled = false;
      live.textContent = 'Saved as JPG.';
    };
    img.onerror = function () {
      URL.revokeObjectURL(blobUrl);
      btn.disabled = false;
      live.textContent = 'That illustration could not be rendered. Try writing another.';
    };
    img.src = blobUrl;
  });

  function spaced(s) { return s.split('').join(' '); }
  function isoDay() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
           '-' + String(d.getDate()).padStart(2, '0');
  }

  setState('input');
  body.dataset.ready = 'no';
})();
</script>
</body>
</html>
