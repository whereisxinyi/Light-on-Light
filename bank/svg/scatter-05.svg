<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="680" fill="#fdfdfb"/>
  
  <g transform="rotate(-1.5 340 340)">
    <!-- 最外层：几乎消散的虚圆 -->
    <circle cx="340" cy="340" r="140" fill="none" stroke="#1a1a1a" 
            stroke-width="1.5" stroke-dasharray="1,12" opacity="0.2"/>
    
    <!-- 第二层 -->
    <circle cx="340" cy="340" r="105" fill="none" stroke="#1a1a1a" 
            stroke-width="2" stroke-dasharray="4,7" opacity="0.4"/>
    
    <!-- 第三层 -->
    <circle cx="340" cy="340" r="75" fill="none" stroke="#1a1a1a" 
            stroke-width="2.5" stroke-dasharray="7,4" opacity="0.65"/>
    
    <!-- 最内层：相对清晰 -->
    <circle cx="340" cy="340" r="50" fill="none" stroke="#1a1a1a" 
            stroke-width="2.5" stroke-dasharray="10,2" opacity="0.9"/>
    
    <!-- 散落的小点：思想消散 -->
    <circle cx="420" cy="280" r="1.8" fill="#1a1a1a" opacity="0.35"/>
    <circle cx="450" cy="310" r="1.2" fill="#1a1a1a" opacity="0.25"/>
    <circle cx="470" cy="360" r="1.5" fill="#1a1a1a" opacity="0.3"/>
    <circle cx="440" cy="420" r="1" fill="#1a1a1a" opacity="0.2"/>
    <circle cx="270" cy="390" r="1.3" fill="#1a1a1a" opacity="0.28"/>
    <circle cx="240" cy="320" r="1.6" fill="#1a1a1a" opacity="0.3"/>
    <circle cx="300" cy="260" r="1.2" fill="#1a1a1a" opacity="0.22"/>
  </g>
</svg>