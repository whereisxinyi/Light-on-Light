<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="680" fill="#fdfdfb"/>
  
  <g transform="rotate(1.6 340 340)">
    <!-- 左支撑 -->
    <line x1="150" y1="360" x2="150" y2="440" stroke="#1a1a1a" stroke-width="2"/>
    
    <!-- 右支撑 -->
    <line x1="530" y1="360" x2="530" y2="440" stroke="#1a1a1a" stroke-width="2"/>
    
    <!-- 主桥身：虚线表现修复中的状态 -->
    <path 
      d="M 150 360 Q 340 220, 530 360" 
      fill="none" 
      stroke="#1a1a1a" 
      stroke-width="4"
      stroke-dasharray="12,6"
    />
    
    <!-- 修补细节：小线条 -->
    <path 
      d="M 240 310 L 245 300" 
      stroke="#1a1a1a" 
      stroke-width="1.5"
      stroke-dasharray="3,2"
    />
    
    <path 
      d="M 420 290 L 425 280" 
      stroke="#1a1a1a" 
      stroke-width="1.5"
      stroke-dasharray="3,2"
    />
    
    <path 
      d="M 340 240 Q 345 230, 350 240" 
      fill="none"
      stroke="#1a1a1a" 
      stroke-width="1.5"
      stroke-dasharray="3,2"
    />
    
    <!-- 修补痕迹：点 -->
    <circle cx="280" cy="330" r="2" fill="#1a1a1a"/>
    <circle cx="380" cy="310" r="2" fill="#1a1a1a"/>
    <circle cx="460" cy="330" r="2" fill="#1a1a1a"/>
  </g>
</svg>