<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="680" fill="#fdfdfb"/>
  
  <g transform="translate(340, 340) rotate(1.3) translate(-340, -340)">
    <!-- 门框左竖线 -->
    <line x1="280" y1="140" x2="280" y2="540" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="8,4"/>
    
    <!-- 门框右竖线 -->
    <line x1="400" y1="140" x2="400" y2="540" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="8,4"/>
    
    <!-- 门框上横线 -->
    <line x1="280" y1="140" x2="400" y2="140" stroke="#1a1a1a" stroke-width="3"/>
    
    <!-- 门框下横线 -->
    <line x1="280" y1="540" x2="400" y2="540" stroke="#1a1a1a" stroke-width="3"/>
    
    <!-- 门的中线 -->
    <line x1="340" y1="140" x2="340" y2="540" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="8,6"/>
    
    <!-- 门把手 -->
    <circle cx="368" cy="340" r="4" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  </g>
</svg>