<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="680" fill="#fdfdfb"/>
  
  <g transform="rotate(1.5 340 340)">
    <!-- Rain lines falling from top -->
    <line x1="140" y1="60" x2="130" y2="300" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6,4"/>
    <line x1="220" y1="40" x2="225" y2="280" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6,4"/>
    <line x1="310" y1="50" x2="315" y2="300" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6,4"/>
    <line x1="400" y1="30" x2="395" y2="270" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6,4"/>
    <line x1="490" y1="60" x2="485" y2="300" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6,4"/>
    <line x1="570" y1="40" x2="575" y2="280" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6,4"/>
    
    <!-- Lighter rain lines -->
    <line x1="170" y1="80" x2="165" y2="320" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5"/>
    <line x1="350" y1="70" x2="355" y2="310" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5"/>
    <line x1="520" y1="90" x2="515" y2="330" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5"/>
    
    <!-- Figure with open, accepting posture -->
    <circle cx="340" cy="320" r="22" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
    <line x1="340" y1="344" x2="340" y2="470" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Left arm reaching up -->
    <path d="M 316 360 Q 250 310 230 250" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Right arm reaching up -->
    <path d="M 364 360 Q 430 310 450 250" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
    
    <line x1="328" y1="470" x2="320" y2="560" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
    <line x1="352" y1="470" x2="360" y2="560" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Open palms -->
    <circle cx="230" cy="250" r="3" fill="#1a1a1a"/>
    <circle cx="450" cy="250" r="3" fill="#1a1a1a"/>
  </g>
</svg>