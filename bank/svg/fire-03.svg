<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="680" fill="#fdfdfb"/>
  
  <g transform="rotate(1.2 340 340)">
    <!-- 头 -->
    <circle cx="340" cy="140" r="36" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="3,2.5"/>
    
    <!-- 身体 - 左 -->
    <path d="M 310 180 Q 308 260 310 360" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4,2"/>
    
    <!-- 身体 - 右 -->
    <path d="M 370 180 Q 372 260 370 360" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4,2"/>
    
    <!-- 胸口的光 - 外环虚线 -->
    <circle cx="340" cy="290" r="35" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="2,3"/>
    
    <!-- 胸口的光 - 内环 -->
    <circle cx="340" cy="290" r="22" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
    
    <!-- 中心点 -->
    <circle cx="340" cy="290" r="5" fill="#1a1a1a"/>
    
    <!-- 放射线 - 上 -->
    <path d="M 340 252 Q 343 263 337 260" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
    
    <!-- 放射线 - 下 -->
    <path d="M 340 328 Q 343 317 337 320" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
    
    <!-- 放射线 - 左 -->
    <path d="M 302 290 Q 313 293 310 287" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
    
    <!-- 放射线 - 右 -->
    <path d="M 378 290 Q 367 293 370 287" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
    
    <!-- 对角放射线 - 左上 -->
    <path d="M 318 268 Q 327 278 322 273" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- 对角放射线 - 右下 -->
    <path d="M 362 312 Q 353 302 358 307" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>