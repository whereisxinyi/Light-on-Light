<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="680" fill="#fdfdfb"/>
  
  <g transform="rotate(1.3 340 340)">
    <!-- Turbulent outer ripples (dashed - disturbance) -->
    <circle cx="340" cy="340" r="170" fill="none" stroke="#1a1a1a" stroke-width="2.2" stroke-dasharray="16,8" opacity="0.7"/>
    <circle cx="340" cy="340" r="140" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="13,6" opacity="0.65"/>
    <circle cx="340" cy="340" r="110" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="10,5" opacity="0.55"/>
    
    <!-- Clear inner ripples (solid - clarity) -->
    <circle cx="340" cy="340" r="80" fill="none" stroke="#1a1a1a" stroke-width="1.5" opacity="0.85"/>
    <circle cx="340" cy="340" r="50" fill="none" stroke="#1a1a1a" stroke-width="1.5" opacity="0.8"/>
    <circle cx="340" cy="340" r="25" fill="none" stroke="#1a1a1a" stroke-width="1.5" opacity="0.75"/>
    
    <!-- Stillness center -->
    <circle cx="340" cy="340" r="3" fill="#1a1a1a"/>
  </g>
</svg>