<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="680" fill="#fdfdfb"/>
  
  <g transform="rotate(1.3 340 340)">
    
    <!-- 左侧门框 -->
    <line x1="220" y1="120" x2="220" y2="560" stroke="#1a1a1a" stroke-width="3.5"/>
    
    <!-- 右侧门框 -->
    <line x1="460" y1="120" x2="460" y2="560" stroke="#1a1a1a" stroke-width="3.5"/>
    
    <!-- 上门框 -->
    <line x1="220" y1="120" x2="460" y2="120" stroke="#1a1a1a" stroke-width="3.5"/>
    
    <!-- 下门框 -->
    <line x1="220" y1="560" x2="460" y2="560" stroke="#1a1a1a" stroke-width="3.5"/>
    
    <!-- 门扉 - 虚线，表现"永不关闭"的状态 -->
    <line x1="220" y1="120" x2="220" y2="560" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="13,8" opacity="0.7"/>
    
    <!-- 门把手 -->
    <circle cx="435" cy="340" r="5" fill="#1a1a1a"/>
    
    <!-- 地平参考线 -->
    <path d="M 160 560 Q 340 570 520 560" stroke="#1a1a1a" stroke-width="1.5" fill="none" opacity="0.35"/>
    
  </g>
  
</svg>