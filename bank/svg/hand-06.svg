<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="680" fill="#fdfdfb"/>
  
  <g transform="translate(340, 380) rotate(1)">
    <!-- 掌心 -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="2,3"/>
    
    <!-- 五根手指 -->
    <!-- 大拇指 -->
    <path d="M -28,-5 Q -65,-20 -100,-55" 
          fill="none" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="3,2" stroke-linecap="round"/>
    
    <!-- 食指 -->
    <path d="M -15,-28 Q -18,-95 -15,-155" 
          fill="none" stroke="#1a1a1a" stroke-width="2.2" stroke-dasharray="2.5,2" stroke-linecap="round"/>
    
    <!-- 中指 -->
    <path d="M 0,-32 Q 2,-105 5,-175" 
          fill="none" stroke="#1a1a1a" stroke-width="2.2" stroke-dasharray="2.5,2" stroke-linecap="round"/>
    
    <!-- 无名指 -->
    <path d="M 15,-28 Q 16,-98 18,-160" 
          fill="none" stroke="#1a1a1a" stroke-width="2.2" stroke-dasharray="2.5,2" stroke-linecap="round"/>
    
    <!-- 小指 -->
    <path d="M 28,-5 Q 62,-15 98,-48" 
          fill="none" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="3,2" stroke-linecap="round"/>
  </g>
  
  <!-- 点缀元素 -->
  <circle cx="140" cy="180" r="2" fill="#1a1a1a"/>
  <circle cx="590" cy="160" r="2.5" fill="#1a1a1a"/>
  <circle cx="630" cy="480" r="1.8" fill="#1a1a1a"/>
  <circle cx="75" cy="540" r="2" fill="#1a1a1a"/>
  <circle cx="570" cy="640" r="2" fill="#1a1a1a"/>
</svg>