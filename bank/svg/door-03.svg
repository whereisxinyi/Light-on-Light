<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="680" fill="#fdfdfb"/>
  
  <g transform="rotate(1.5 340 340)">
    <!-- 门框 (EXIT) -->
    <line x1="180" y1="180" x2="180" y2="500" stroke="#1a1a1a" stroke-width="3"/>
    <line x1="320" y1="180" x2="320" y2="500" stroke="#1a1a1a" stroke-width="3"/>
    <line x1="180" y1="180" x2="320" y2="180" stroke="#1a1a1a" stroke-width="3"/>
    <line x1="180" y1="500" x2="320" y2="500" stroke="#1a1a1a" stroke-width="3"/>
    
    <!-- 打开的门板 -->
    <path d="M 250 340 Q 270 320 300 310" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="8,4" fill="none"/>
    
    <!-- 门把 -->
    <circle cx="300" cy="340" r="8" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    
    <!-- 虚线足迹（LEAVING），逐渐消散 -->
    <line x1="340" y1="280" x2="420" y2="240" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="6,4"/>
    <line x1="420" y1="240" x2="490" y2="200" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="5,5" opacity="0.7"/>
    <line x1="490" y1="200" x2="550" y2="160" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>
    
    <!-- 末端的点 -->
    <circle cx="420" cy="240" r="2.5" fill="#1a1a1a" opacity="0.6"/>
    <circle cx="490" cy="200" r="2" fill="#1a1a1a" opacity="0.4"/>
    <circle cx="550" cy="160" r="1.5" fill="#1a1a1a" opacity="0.2"/>
  </g>
</svg>