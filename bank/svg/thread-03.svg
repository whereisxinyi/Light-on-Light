<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="680" fill="#fdfdfb"/>
  
  <g transform="rotate(1.3 340 340)">
    <!-- 起始线：笔直清晰 -->
    <line x1="60" y1="340" x2="160" y2="340" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- 线条开始弯曲 -->
    <path d="M 160 340 Q 220 280, 280 310" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- 继续弯曲，幅度加大 -->
    <path d="M 280 310 Q 340 270, 390 300" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-dasharray="5,3" stroke-linecap="round"/>
    
    <!-- 螺旋式向下 -->
    <path d="M 390 300 Q 440 360, 480 360" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-dasharray="5,4" stroke-linecap="round"/>
    
    <!-- 汇聚回中心 -->
    <path d="M 480 360 Q 510 340, 520 300" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-dasharray="4,3" stroke-linecap="round"/>
    
    <!-- 最后形成的同心圆——故事的完整形态 -->
    <circle cx="520" cy="340" r="85" stroke="#1a1a1a" stroke-width="1.5" fill="none" stroke-dasharray="8,5" stroke-linecap="round"/>
    <circle cx="520" cy="340" r="55" stroke="#1a1a1a" stroke-width="1.5" fill="none" stroke-dasharray="6,4" stroke-linecap="round"/>
    <circle cx="520" cy="340" r="25" stroke="#1a1a1a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" stroke-linecap="round"/>
    
    <!-- 随性细节 -->
    <path d="M 610 260 L 625 280" stroke="#1a1a1a" stroke-width="1" fill="none" stroke-dasharray="2,2" stroke-linecap="round"/>
    <circle cx="630" cy="400" r="5" stroke="#1a1a1a" stroke-width="1.5" fill="none" stroke-dasharray="2,1"/>
  </g>
</svg>