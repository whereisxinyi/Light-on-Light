<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="680" fill="#fdfdfb"/>
  <g transform="rotate(1.5 340 340)">
    <!-- Peaked roof - the promise structure -->
    <path d="M 240 300 L 340 190 L 440 300" stroke="#1a1a1a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12,4"/>
    
    <!-- Roof eaves -->
    <line x1="215" y1="315" x2="465" y2="315" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-dasharray="9,3"/>
    
    <!-- Rain falling - the need the roof promises to meet -->
    <circle cx="190" cy="390" r="3.5" fill="#1a1a1a"/>
    <circle cx="270" cy="430" r="2.5" fill="#1a1a1a" opacity="0.7"/>
    <circle cx="410" cy="410" r="3" fill="#1a1a1a"/>
    <circle cx="510" cy="450" r="2.5" fill="#1a1a1a" opacity="0.7"/>
    <circle cx="340" cy="480" r="3" fill="#1a1a1a"/>
    <circle cx="140" cy="520" r="2" fill="#1a1a1a" opacity="0.6"/>
    <circle cx="560" cy="530" r="2" fill="#1a1a1a" opacity="0.6"/>
    
    <!-- Vertical rain streaks -->
    <line x1="210" y1="350" x2="205" y2="390" stroke="#1a1a1a" stroke-width="1.5" opacity="0.45" stroke-dasharray="3,2"/>
    <line x1="470" y1="355" x2="480" y2="400" stroke="#1a1a1a" stroke-width="1.5" opacity="0.45" stroke-dasharray="3,2"/>
    <line x1="340" y1="340" x2="335" y2="375" stroke="#1a1a1a" stroke-width="1.5" opacity="0.45" stroke-dasharray="3,2"/>
  </g>
</svg>