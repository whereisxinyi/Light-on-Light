<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="680" fill="#fdfdfb"/>
  
  <g transform="rotate(1.8 340 340)">
    
    <!-- 光晕层 1（最外层） -->
    <circle cx="340" cy="340" r="160" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="12,10" opacity="0.4"/>
    
    <!-- 光晕层 2 -->
    <circle cx="340" cy="340" r="100" fill="none" stroke="#1a1a1a" stroke-width="1.3" stroke-dasharray="7,6" opacity="0.6"/>
    
    <!-- 光晕层 3（最内层） -->
    <circle cx="340" cy="340" r="50" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.8"/>
    
    <!-- 中心光源 -->
    <circle cx="340" cy="340" r="5" fill="#1a1a1a"/>
    
    <!-- 规则光线组（对称的主光线） -->
    <line x1="340" y1="340" x2="340" y2="80" stroke="#1a1a1a" stroke-width="1.7" stroke-dasharray="8,6"/>
    <line x1="340" y1="340" x2="509" y2="171" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="8,6"/>
    <line x1="340" y1="340" x2="600" y2="340" stroke="#1a1a1a" stroke-width="1.7" stroke-dasharray="8,6"/>
    <line x1="340" y1="340" x2="509" y2="509" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="8,6"/>
    <line x1="340" y1="340" x2="340" y2="600" stroke="#1a1a1a" stroke-width="1.7" stroke-dasharray="8,6"/>
    <line x1="340" y1="340" x2="171" y2="509" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="8,6"/>
    <line x1="340" y1="340" x2="80" y2="340" stroke="#1a1a1a" stroke-width="1.7" stroke-dasharray="8,6"/>
    <line x1="340" y1="340" x2="171" y2="171" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="8,6"/>
    
    <!-- 不规则光线组（"有点不一样"的新光线） -->
    <path d="M 340 340 Q 380 300 460 140" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="5,7"/>
    <path d="M 340 340 Q 310 420 280 580" fill="none" stroke="#1a1a1a" stroke-width="1.3" stroke-dasharray="6,5"/>
    <path d="M 340 340 Q 280 290 160 200 L 100 140" fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="4,6"/>
    <path d="M 340 340 Q 420 390 560 510" fill="none" stroke="#1a1a1a" stroke-width="1.35" stroke-dasharray="5,5"/>
    
    <!-- 光线碎片 -->
    <line x1="340" y1="340" x2="470" y2="220" stroke="#1a1a1a" stroke-width="1.1" stroke-dasharray="3,5" opacity="0.7"/>
    <line x1="340" y1="340" x2="480" y2="450" stroke="#1a1a1a" stroke-width="1.1" stroke-dasharray="4,4" opacity="0.65"/>
    
  </g>
  
</svg>