<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="680" fill="#fdfdfb"/>
  
  <g transform="rotate(1.3 340 340)">
    <!-- 房间虚线轮廓 -->
    <rect x="150" y="150" width="380" height="380" 
          fill="none" stroke="#1a1a1a" stroke-width="2.5" 
          stroke-dasharray="12,8"/>
    
    <!-- 门框（左和上） -->
    <line x1="200" y1="200" x2="200" y2="520" stroke="#1a1a1a" stroke-width="3.5"/>
    <line x1="200" y1="200" x2="520" y2="200" stroke="#1a1a1a" stroke-width="3.5"/>
    
    <!-- 半开的门 -->
    <path d="M 200 200 Q 300 160 370 220 Q 420 280 400 360 Q 420 440 370 500 Q 300 540 200 520" 
          fill="none" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- 门把手 -->
    <circle cx="385" cy="360" r="6" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
    
    <!-- 从门溢出的虚线轨迹 -->
    <path d="M 260 210 Q 300 140 360 170" 
          fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="6,5" opacity="0.55"/>
    
    <circle cx="360" cy="170" r="2" fill="#1a1a1a" opacity="0.4"/>
    <circle cx="310" cy="150" r="1.5" fill="#1a1a1a" opacity="0.35"/>
    
    <path d="M 240 360 L 140 360" 
          fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="6,5" opacity="0.5"/>
    
    <circle cx="160" cy="360" r="2" fill="#1a1a1a" opacity="0.4"/>
    
    <path d="M 260 520 Q 300 600 360 570" 
          fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="6,5" opacity="0.55"/>
    
    <circle cx="360" cy="570" r="2" fill="#1a1a1a" opacity="0.4"/>
    <circle cx="310" cy="590" r="1.5" fill="#1a1a1a" opacity="0.35"/>
  </g>
</svg>