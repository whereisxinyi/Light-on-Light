<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="680" fill="#fdfdfb"/>
  
  <g transform="rotate(1.3 340 340)">
    
    <!-- Room: four walls -->
    <line x1="160" y1="160" x2="160" y2="520" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="12,6"/>
    <line x1="160" y1="160" x2="400" y2="160" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="12,6"/>
    <line x1="400" y1="160" x2="400" y2="520" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="12,6"/>
    <line x1="160" y1="520" x2="400" y2="520" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="14,7"/>
    
    <!-- Door frame -->
    <line x1="380" y1="160" x2="380" y2="520" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="8,4"/>
    
    <!-- Open door: curved lines swinging outward -->
    <path d="M 380 240 Q 470 200 530 240" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-dasharray="8,4"/>
    <path d="M 380 400 Q 480 430 540 400" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-dasharray="8,4"/>
    
    <!-- Door handle -->
    <circle cx="374" cy="340" r="3.5" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    
    <!-- Memory flowing outward: upper thread -->
    <path d="M 530 240 L 580 200 Q 600 180 610 210" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-dasharray="6,4"/>
    
    <!-- Memory flowing outward: lower thread -->
    <path d="M 540 400 Q 590 440 620 480" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
    
    <!-- Wandering line in between -->
    <path d="M 550 320 Q 580 310 600 335 Q 610 360 590 375" stroke="#1a1a1a" stroke-width="1.8" fill="none" stroke-dasharray="5,3"/>
    
    <!-- Scattered memory fragments: dots -->
    <circle cx="570" cy="190" r="2" fill="#1a1a1a"/>
    <circle cx="610" cy="215" r="1.5" fill="#1a1a1a"/>
    <circle cx="630" cy="270" r="1" fill="#1a1a1a"/>
    <circle cx="640" cy="330" r="1.5" fill="#1a1a1a"/>
    <circle cx="620" cy="380" r="2" fill="#1a1a1a"/>
    <circle cx="600" cy="450" r="1.5" fill="#1a1a1a"/>
    <circle cx="580" cy="500" r="1" fill="#1a1a1a"/>
    
    <!-- Interior texture: whispered lines suggesting space -->
    <line x1="220" y1="280" x2="375" y2="280" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,3" opacity="0.45"/>
    <line x1="240" y1="360" x2="375" y2="360" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,3" opacity="0.45"/>
    <line x1="200" y1="450" x2="375" y2="450" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,3" opacity="0.45"/>
    
  </g>
</svg>