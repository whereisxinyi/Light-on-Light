<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="680" fill="#fdfdfb"/>
  
  <g transform="rotate(1.5 340 340)">
    <!-- Right half: clear, stays -->
    <circle cx="380" cy="340" r="110" fill="none" stroke="#1a1a1a" stroke-width="2.8"/>
    
    <!-- Left half: fading away -->
    <circle cx="300" cy="340" r="110" fill="none" stroke="#1a1a1a" stroke-width="2.8" stroke-dasharray="6,5" opacity="0.55"/>
    
    <!-- Center dividing line -->
    <line x1="340" y1="190" x2="340" y2="490" stroke="#1a1a1a" stroke-width="2.2" stroke-dasharray="3,2.5"/>
    
    <!-- Left side dispersing particles -->
    <circle cx="215" cy="330" r="2.5" fill="#1a1a1a" opacity="0.4"/>
    <circle cx="200" cy="360" r="1.8" fill="#1a1a1a" opacity="0.3"/>
    <circle cx="230" cy="375" r="1.5" fill="#1a1a1a" opacity="0.25"/>
    <circle cx="185" cy="320" r="1.2" fill="#1a1a1a" opacity="0.2"/>
    <circle cx="225" cy="305" r="1.3" fill="#1a1a1a" opacity="0.35"/>
    
    <!-- Wisp element on left -->
    <path d="M 240 290 Q 230 310 220 340 Q 215 360 225 375" fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="2,3" opacity="0.4"/>
  </g>
</svg>