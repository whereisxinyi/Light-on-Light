<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="680" fill="#fdfdfb"/>
  
  <g transform="rotate(1.5 340 340)">
    <!-- 上部分：轻飘飘的虚线圆圈（看起来） -->
    <circle cx="160" cy="130" r="35" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
    <circle cx="380" cy="100" r="40" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-dasharray="4,4"/>
    <circle cx="520" cy="170" r="32" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-dasharray="6,3"/>
    <circle cx="300" cy="180" r="38" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
    
    <!-- 中间分割线：从表象到现实 -->
    <line x1="100" y1="300" x2="620" y2="350" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="3,3"/>
    
    <!-- 下部分：沉重的不规则块面（实际） -->
    <path d="M 220 400 L 280 380 L 360 385 L 420 400 L 440 450 L 420 520 L 300 540 L 180 510 Z" 
          fill="#1a1a1a" opacity="0.2" stroke="#1a1a1a" stroke-width="1.5"/>
    
    <!-- 下压的箭头 - 压力感 -->
    <line x1="310" y1="340" x2="310" y2="490" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 310 510 L 300 490 L 320 490 Z" fill="#1a1a1a"/>
  </g>
</svg>