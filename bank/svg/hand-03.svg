<svg viewBox="0 0 680 680">
  <rect width="680" height="680" fill="#fdfdfb"/>
  
  <g transform="rotate(1.3 340 340)" stroke="#1a1a1a" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Left hand -->
    <path d="M 180 320 Q 280 260 340 280" stroke-width="2.8" stroke-dasharray="3,2"/>
    
    <!-- Right hand -->
    <path d="M 500 320 Q 400 260 340 280" stroke-width="2.8" stroke-dasharray="3,2"/>
    
    <!-- Held object -->
    <circle cx="340" cy="280" r="28" stroke-width="2" stroke-dasharray="4,3"/>
    
    <!-- Weight/burden lines (increasingly heavy) -->
    <line x1="310" y1="350" x2="370" y2="350" stroke-width="2"/>
    <line x1="300" y1="385" x2="380" y2="385" stroke-width="2.5"/>
    <line x1="285" y1="420" x2="395" y2="420" stroke-width="3"/>
    <line x1="270" y1="455" x2="410" y2="455" stroke-width="3.5"/>
    <line x1="255" y1="490" x2="425" y2="490" stroke-width="4"/>
    
  </g>
</svg>