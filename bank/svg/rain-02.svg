<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="680" fill="#fdfdfb"/>
  
  <g transform="rotate(1.2 340 340)">
    <!-- Fine rain lines descending, irregular spacing suggesting "no reason" -->
    <line x1="160" y1="80" x2="150" y2="500" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="12,8"/>
    <line x1="260" y1="70" x2="270" y2="490" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="10,9"/>
    <line x1="380" y1="90" x2="370" y2="510" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="11,7"/>
    <line x1="480" y1="75" x2="490" y2="495" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="9,10"/>
    <line x1="580" y1="100" x2="570" y2="520" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="13,6"/>
    
    <!-- Accumulation point at bottom: rain collected, or tears gathering -->
    <circle cx="340" cy="560" r="8" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="325" cy="575" r="4" fill="#1a1a1a" opacity="0.7"/>
    <circle cx="360" cy="580" r="3" fill="#1a1a1a" opacity="0.6"/>
  </g>
</svg>