<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="680" fill="#fdfdfb"/>
  
  <g transform="rotate(1.3 340 340)">
    <!-- 上段：连贯的线，逐渐变得不稳定 -->
    <path d="M 340 60 Q 335 110 338 160 Q 342 200 340 250" 
          stroke="#1a1a1a" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    
    <!-- 中间：线条散开，表示"lost the thread" -->
    <path d="M 320 270 Q 310 300 315 340" 
          stroke="#1a1a1a" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="6,4"/>
    <path d="M 340 260 Q 350 290 345 330" 
          stroke="#1a1a1a" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="6,4"/>
    <path d="M 360 270 Q 375 305 368 340" 
          stroke="#1a1a1a" stroke-width="1.8" fill="none" opacity="0.4" stroke-dasharray="5,3"/>
    
    <!-- 下段：虚线脚步路径，表示"kept walking" -->
    <path d="M 340 350 L 340 620" 
          stroke="#1a1a1a" stroke-width="1.5" fill="none" stroke-dasharray="10,8" opacity="0.45"/>
    
    <!-- 脚步印记圆圈 -->
    <circle cx="340" cy="390" r="9" stroke="#1a1a1a" stroke-width="2.2" fill="none" opacity="0.8"/>
    <circle cx="340" cy="460" r="9" stroke="#1a1a1a" stroke-width="2.2" fill="none" opacity="0.8"/>
    <circle cx="340" cy="530" r="9" stroke="#1a1a1a" stroke-width="2.2" fill="none" opacity="0.8"/>
    <circle cx="340" cy="600" r="9" stroke="#1a1a1a" stroke-width="2.2" fill="none" opacity="0.8"/>
  </g>
</svg>