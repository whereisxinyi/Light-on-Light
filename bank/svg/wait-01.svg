<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="680" fill="#fdfdfb"/>
  
  <g transform="rotate(1.3 340 340)">
    
    <!-- Concentric circles - work/impact radiating from rest -->
    <circle cx="340" cy="360" r="140" fill="none" stroke="#1a1a1a" stroke-width="1.5" 
            stroke-dasharray="7,5" opacity="0.4"/>
    <circle cx="340" cy="360" r="100" fill="none" stroke="#1a1a1a" stroke-width="1.8" 
            stroke-dasharray="5,4" opacity="0.6"/>
    <circle cx="340" cy="360" r="65" fill="none" stroke="#1a1a1a" stroke-width="2" 
            stroke-dasharray="4,4" opacity="0.75"/>
    <circle cx="340" cy="360" r="35" fill="none" stroke="#1a1a1a" stroke-width="2.2" 
            stroke-dasharray="3,3" opacity="0.9"/>
    
    <!-- Resting figure - lying down horizontally -->
    <!-- Head -->
    <circle cx="210" cy="360" r="18" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
    
    <!-- Neck area -->
    <path d="M 228 353 L 240 350" 
          fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" 
          stroke-dasharray="3,2" opacity="0.7"/>
    
    <!-- Torso - main resting body curve -->
    <path d="M 240 350 Q 290 340, 380 345 Q 420 347, 450 352" 
          fill="none" stroke="#1a1a1a" stroke-width="2.6" stroke-linecap="round"/>
    
    <!-- Left shoulder/arm -->
    <path d="M 245 338 Q 280 315, 330 325" 
          fill="none" stroke="#1a1a1a" stroke-width="2" 
          stroke-linecap="round" stroke-dasharray="6,3" opacity="0.8"/>
    
    <!-- Right arm area -->
    <path d="M 420 350 Q 455 340, 480 350" 
          fill="none" stroke="#1a1a1a" stroke-width="1.8" 
          stroke-linecap="round" stroke-dasharray="5,3" opacity="0.75"/>
    
    <!-- Legs extended -->
    <path d="M 450 355 L 510 355 L 540 352" 
          fill="none" stroke="#1a1a1a" stroke-width="2" 
          stroke-linecap="round" stroke-dasharray="4,3" opacity="0.8"/>
    
  </g>
</svg>