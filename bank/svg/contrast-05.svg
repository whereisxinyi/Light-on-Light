<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="680" fill="#fdfdfb"/>
  
  <g transform="rotate(1.3 340 340)">
    
    <!-- 左边：想休息 - 虚线圆圈 -->
    <circle cx="200" cy="340" r="90" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="18,15"/>
    
    <!-- 右边：清单变长 - 向下的虚线箭头 -->
    <line x1="510" y1="150" x2="510" y2="480" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="10,12"/>
    
    <!-- 箭头头 -->
    <line x1="510" y1="480" x2="500" y2="460" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="510" y1="480" x2="520" y2="460" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
    
  </g>
</svg>