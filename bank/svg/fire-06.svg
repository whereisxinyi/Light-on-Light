<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="680" fill="#fdfdfb"/>
  
  <g transform="rotate(1 340 340)">
    
    <!-- 左半部分：火柴（保留的） -->
    <g>
      <line x1="100" y1="150" x2="100" y2="350" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
      <circle cx="100" cy="135" r="10" fill="#1a1a1a"/>
      
      <line x1="160" y1="130" x2="160" y2="370" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
      <circle cx="160" cy="115" r="10" fill="#1a1a1a"/>
      
      <line x1="220" y1="170" x2="220" y2="410" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
      <circle cx="220" cy="155" r="10" fill="#1a1a1a"/>
      
      <line x1="280" y1="140" x2="280" y2="380" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
      <circle cx="280" cy="125" r="10" fill="#1a1a1a"/>
      
      <line x1="340" y1="190" x2="340" y2="430" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
      <circle cx="340" cy="175" r="10" fill="#1a1a1a"/>
    </g>
    
    <!-- 中间分割线（手绘感） -->
    <path d="M 380 80 Q 385 290 380 500" 
          stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- 右半部分：虚火（消散的） -->
    <g opacity="0.35" stroke="#1a1a1a" fill="none" stroke-linecap="round">
      <circle cx="510" cy="290" r="45" stroke-width="1.5" stroke-dasharray="4,6"/>
      <circle cx="510" cy="290" r="70" stroke-width="1" stroke-dasharray="6,8" opacity="0.6"/>
      <line x1="510" y1="215" x2="510" y2="155" stroke-width="1.5" stroke-dasharray="3,5"/>
      <line x1="585" y1="290" x2="645" y2="290" stroke-width="1.5" stroke-dasharray="3,5"/>
      <line x1="435" y1="290" x2="375" y2="290" stroke-width="1.5" stroke-dasharray="3,5"/>
    </g>
    
  </g>
</svg>