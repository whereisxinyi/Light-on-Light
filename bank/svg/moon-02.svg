<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="680" fill="#fdfdfb"/>
  
  <g transform="rotate(1.5 340 340)">
    <!-- 脸部轮廓 -->
    <path d="M 280 140 Q 320 130 350 150 Q 360 170 350 200 Q 320 215 280 210 Q 260 190 270 160 Z" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
    
