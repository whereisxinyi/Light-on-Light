    <!-- 大面积阴影 -->
    <path d="M 260 200 Q 240 240 250 300 Q 230 360 280 420 Q 350 450 420 430 Q 450 390 440 320 Q 460 260 430 200 Q 390 160 330 180 Q 280 185 260 200 Z" fill="#1a1a1a" opacity="0.8"/>
