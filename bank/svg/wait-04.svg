<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="680" fill="#fdfdfb"/>
  
  <g transform="rotate(1.5 340 340)">
    
    <!-- Kettle body -->
    <ellipse cx="340" cy="450" rx="80" ry="90" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="3,2"/>
    
    <!-- Spout -->
    <path d="M 420 420 Q 490 390 520 370" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Handle -->
    <path d="M 270 420 Q 210 380 220 310" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-dasharray="2,2"/>
    
    <!-- Lid -->
    <circle cx="340" cy="360" r="38" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    
    <!-- Lid knob -->
    <circle cx="340" cy="355" r="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    
    <!-- Steam wisps rising -->
    <path d="M 315 350 Q 295 270 315 180" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
    
    <path d="M 340 355 Q 340 270 355 160" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    
    <path d="M 365 350 Q 385 270 370 170" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    
    <!-- Floating dots - understanding particles -->
    <circle cx="310" cy="120" r="2.5" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="0.5"/>
    <circle cx="345" cy="90" r="2" fill="none" stroke="#1a1a1a" stroke-width="0.8" opacity="0.35"/>
    <circle cx="375" cy="110" r="2.5" fill="none" stroke="#1a1a1a" stroke-width="0.9" opacity="0.45"/>
    
  </g>
</svg>