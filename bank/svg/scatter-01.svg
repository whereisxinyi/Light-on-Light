<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="680" fill="#fdfdfb"/>
  
  <g transform="rotate(1.3 340 340)">
    <!-- Core circle - the thought -->
    <circle cx="340" cy="340" r="75" 
            fill="none" 
            stroke="#1a1a1a" 
            stroke-width="2.2"
            stroke-dasharray="20,10"/>
    
    <!-- Center and inner points - the idea -->
    <circle cx="340" cy="340" r="3" fill="#1a1a1a" opacity="0.95"/>
    <circle cx="310" cy="315" r="2" fill="#1a1a1a" opacity="0.7"/>
    <circle cx="370" cy="320" r="2" fill="#1a1a1a" opacity="0.65"/>
    <circle cx="345" cy="375" r="1.8" fill="#1a1a1a" opacity="0.6"/>
    
    <!-- Dispersing points - memory fading -->
    <!-- Upward -->
    <circle cx="340" cy="245" r="1.8" fill="#1a1a1a" opacity="0.42"/>
    <circle cx="340" cy="190" r="1.2" fill="#1a1a1a" opacity="0.22"/>
    <circle cx="340" cy="140" r="0.8" fill="#1a1a1a" opacity="0.08"/>
    
    <!-- Upper right -->
    <circle cx="420" cy="270" r="1.6" fill="#1a1a1a" opacity="0.38"/>
    <circle cx="470" cy="230" r="1" fill="#1a1a1a" opacity="0.18"/>
    
    <!-- Lower right -->
    <circle cx="420" cy="410" r="1.5" fill="#1a1a1a" opacity="0.35"/>
    <circle cx="470" cy="450" r="0.9" fill="#1a1a1a" opacity="0.14"/>
    
    <!-- Lower left -->
    <circle cx="260" cy="410" r="1.4" fill="#1a1a1a" opacity="0.32"/>
    <circle cx="200" cy="460" r="0.8" fill="#1a1a1a" opacity="0.11"/>
  </g>
</svg>