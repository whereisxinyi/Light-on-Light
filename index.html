/* Light on Light — design tokens
 * Hallmark · route: custom (tuned) · vibe: "warm fog, emerging trace, breathing"
 * axes: light / roman-serif / chromatic-amber ~65°
 * Every colour and font below references a token from this block.
 */

:root {
  /* ---------- Colour · warm fog paper, amber signal ---------- */
  /* Paper is never pure white; every neutral carries chroma toward hue ~68. */
  --color-paper:       oklch(96.5% 0.008 72);   /* 暖雾白 — the page */
  --color-paper-2:     oklch(94%   0.010 70);   /* 雾略沉一层 */
  --color-paper-3:     oklch(90.5% 0.012 68);   /* 雾最浓处 — the thought */

  --color-ink:         oklch(21%   0.012 66);   /* 近黑暖褐 — text, and the entry surface */
  --color-ink-2:       oklch(38%   0.011 64);   /* 次级文字 · 铅笔痕 */
  --color-neutral:     oklch(46%   0.010 66);
  --color-muted:       oklch(52.5% 0.010 66);   /* 弱化文字 — measured 4.92:1 on paper,
                                                 * clears WCAG AA at the 12.8px micro size */

  --color-rule:        oklch(82%   0.010 70);   /* 发丝线 */
  --color-rule-2:      oklch(88%   0.008 70);   /* 更淡的发丝线 */

  /* On the near-black entry surface */
  --color-ink-paper:   oklch(92%   0.010 70);   /* 暗底上的正文 */
  --color-ink-muted:   oklch(66%   0.010 68);   /* 暗底上的弱化文字 */
  --color-ink-rule:    oklch(32%   0.012 66);   /* 暗底上的发丝线 */

  /* 微光 — lighter than paper, so it only reads where the fog is thick.
   * Not a base surface; it is a light source inside the haze. */
  --color-glow:        oklch(99%   0.012 78);

  /* The plate — the illustration's own paper and ink, fixed by the
   * hand-drawn-quote-art skill. Deliberately NOT the site's warm fog: the
   * artworks are a series, and a series' colours are its identity. Every
   * exported gift uses these two values and no others, so a year of them
   * stacks into one body of work. */
  --color-plate-paper: #fdfdfb;
  --color-plate-ink:   #1a1a1a;

  /* The only chromatic colour on the page. Lands once: under the wordmark. */
  --color-accent:      oklch(64%   0.14  65);   /* 琥珀 */
  --color-accent-ink:  oklch(21%   0.012 66);   /* accent L > 50 → 用 ink 作叠字 */
  --color-focus:       oklch(60%   0.19  65);

  /* ---------- Type ---------- */
  /* Two families. Noto Serif SC carries display (200) and body (400);
   * Geist Mono is the single outlier — wordmark + page furniture only. */
  --font-wordmark: "Instrument Serif", ui-serif, Georgia, serif;
  --font-display:  "Noto Serif SC", "Songti SC", ui-serif, Georgia, serif;
  --font-body:     "Noto Serif SC", "Songti SC", ui-serif, Georgia, serif;
  --font-mono:     "Geist Mono", ui-monospace, SFMono-Regular, "SF Mono", monospace;
  /* The skill's handwriting stack, verbatim. System faces only — the plate has
   * to render identically in the browser and on the export canvas, and a
   * webfont would not survive rasterisation the same way. CJK fallbacks are
   * appended because the stack itself carries no Chinese. */
  --font-hand:     "Segoe Print", "Bradley Hand", "Comic Sans MS",
                   "Hanzipen SC", "Yuanti SC", cursive;
  /* --font-display / --font-body carry CJK for the layers behind the opening.
   * The opening itself loads only Instrument Serif + Geist Mono. */

  /* 1.25 major third, floored at 12.8px because CJK dies below that */
  --text-xs:        0.8rem;      /* 12.8px — mono furniture */
  --text-base:      1rem;
  --text-md:        1.25rem;     /* 20px — body */
  --text-lg:        1.5625rem;   /* 25px */
  --text-display-s: clamp(1.6rem, 3.6vw, 2.4414rem);
  --text-display:   clamp(2.75rem, 7vw, 5.25rem);
  --text-wordmark:  clamp(2.3rem, 6.6vw, 5.25rem);   /* the brand, and every page's H1 */
  /* Layer 02's statement + lede sizes. All sit under the 5.5rem display
   * ceiling. Hierarchy is carried by size, colour, and the serif/mono split —
   * Instrument Serif ships one weight, so weight contrast is not on the table. */
  --text-turn:      clamp(2.1rem, 5.2vw, 4rem);
  --text-lede:      clamp(1.15rem, 1.5vw + 0.6rem, 1.6rem);
  /* Layer 03. The greeting leads; the writing line sits quieter beneath it. */
  --text-greet:     clamp(1.5rem, 2.4vw, 2rem);
  --text-write:     clamp(1rem, 1.1vw + 0.5rem, 1.25rem);
  --text-quote:     clamp(1.05rem, 1.1vw + 0.7rem, 1.45rem);

  /* ---------- Space · 4pt scale ---------- */
  --space-3xs: 0.125rem;
  --space-2xs: 0.25rem;
  --space-xs:  0.5rem;
  --space-sm:  0.75rem;
  --space-md:  1rem;
  --space-lg:  1.5rem;
  --space-xl:  2.5rem;
  --space-2xl: 4rem;
  --space-3xl: 6rem;
  --space-4xl: 9rem;

  --page-gutter: clamp(1.25rem, 5vw, 5rem);

  /* ---------- Rules & radii ---------- */
  --rule-hair: 1px;
  --radius-none: 0;
  --radius-plate: 3px;    /* photographs have corners, barely */
  --radius-pill: 999px;   /* the invitation is the one rounded thing here */

  /* Bottom clearance so the fixed invitation can never cover the colophon. */
  --cta-clearance: 7.5rem;

  /* ---------- Motion ---------- */
  --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in:     cubic-bezier(0.7, 0, 0.84, 0);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);

  --dur-micro: 120ms;
  --dur-short: 220ms;
  --dur-long:  420ms;

  /* Weather durations. The opening is paced in seconds, not milliseconds —
   * a deliberate override of Hallmark's ≤500ms reveal / no-loop rules,
   * at the project owner's instruction. */
  --dur-emerge:  4200ms;   /* the field becoming visible */
  --dur-slow:    1600ms;   /* hover — weather, not UI feedback */
  --dur-drift-a: 21s;      /* the haze ground. Coprime-ish periods, so the */
  --dur-drift-b: 27s;      /* composite state never visibly repeats. */
  --dur-drift-c: 34s;
  --dur-breath:  15s;
  --dur-grow:    17s;
  /* The swarm's own timings are randomised per element in JS — see the
   * generator in index.html. These are only the bounds it draws from. */

  /* ---------- Depth ---------- */
  --z-base:   1;
  --z-raised: 10;
  --z-sticky: 200;
}

/* SOURCE FILE — index.html is a single self-contained page and does not link
 * this stylesheet; it embeds a copy. Edit here, then run `python3 build.py`
 * to regenerate index.html. Editing index.html's <style> directly works too,
 * but the next build will overwrite it.
 *
 * Hallmark · route: custom (bespoke)
 * structure: one silent screen — a living field, a growing seam, a wordmark that is the door
 * idea: "the name scatters into its own letters; the wordmark is where they settle"
 * paper: oklch(96.5% 0.008 72) · accent: oklch(64% 0.14 65) · glow: oklch(99% 0.012 78)
 * display: Instrument Serif · outlier: Geist Mono
 * axes: light / roman-serif / chromatic-amber ~65°
 * motion: emerge · haze · swarm · mark  (4 systems)
 *   OVERRIDE — Hallmark bans infinite loops, caps reveals at ~500ms, and caps
 *   a page at three motion primitives. The project owner asked for a living
 *   installation-grade field: constant flicker, bounce, gathering, dispersal,
 *   and genuine randomness. All four caps are overridden by instruction.
 *   Mitigations kept: every animation touches only transform/opacity; the
 *   fastest flicker is a 1.8s on-off cycle (~0.55 Hz, well under the 3 Hz
 *   photosensitivity gate); the accent stays under 0.1% of the viewport;
 *   the whole field collapses to a static scatter under reduced-motion.
 * studied: two reference videos — (a) a black field of hand-drawn quad outlines
 *   drifting, clustering, dispersing on independent rhythms; (b) single letters
 *   floating at varied depth and blur, fully appearing and fully vanishing.
 *   Behaviour and element vocabulary taken; palette deliberately not taken.
 * pre-emit critique: P5 H4 E4 S5 R4 V5
 * contrast: pass (40–41) · mobile: pass (34, 49, 50–57) · tokens: pass (48)
 * nav/footer: n/a — the page has neither · slop: pass (42–45)
 * OVERRIDDEN, not passed:
 *   gate 29 (abstract background ≤5%, ≤2 blooms, no animation) — the haze is
 *     4 layers, animated, and covers most of the field. It is not a background:
 *     it is the page's subject, it is monochrome (zero accent), and the owner
 *     specified it. Recorded as an override so an audit doesn't read it as a miss.
 *   gate 26 (eight states) — the page's one link ships default / hover /
 *     focus-visible / active. No :disabled: a wordmark that is never disabled
 *     would be dead code.
 *   gate 44a (padding-block-end ≥ 1.3× start) — n/a: there is no next section
 *     for the hero to sit into. Asymmetry is carried by the composition instead.
 * v1.1.0
 */

/* ============================================================
   Base
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

html {
  overflow-x: clip;
  -webkit-text-size-adjust: 100%;
}

body {
  overflow-x: clip;
  margin: 0;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-wordmark);
  -webkit-font-smoothing: antialiased;
}

h1, p { margin: 0; font-weight: 400; }

.filters { position: absolute; width: 0; height: 0; }

/* ============================================================
   The field — one screen, nothing below it
   ============================================================ */

.field {
  position: relative;
  isolation: isolate;
  overflow: clip;
  min-block-size: 100dvh;
  display: grid;
  /* Asymmetric on both axes: the wordmark sits low and left of centre,
     the stamp is parked in the opposite corner. Nothing is centred. */
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  grid-template-rows: 1fr auto auto;
  padding:
    calc(var(--space-xl) + env(safe-area-inset-top))
    max(var(--page-gutter), env(safe-area-inset-right))
    calc(var(--space-xl) + env(safe-area-inset-bottom))
    max(var(--page-gutter), env(safe-area-inset-left));
}

/* ============================================================
   Motion system 1 · emerge
   Alive at first paint. The haze and the swarm carry NO entrance —
   they are simply present, and because every drift/flicker cycle
   starts mid-phase (negative delays), the very first frame is
   already moving. Only the type gets a half-second, delay-free
   fade so paint doesn't flash.
   ============================================================ */

@keyframes emerge { from { opacity: 0; } to { opacity: 1; } }

.seam, .mark, .stamp {
  animation: emerge 500ms var(--ease-out) both;
}

/* ============================================================
   The top line — a seam and the layer it belongs to, paired.
   The seam is LAYER 01's own progress: it grows, recedes, and
   never completes, because the layer isn't finished forming.
   (That pairing is what keeps the rule from being an ornament.)
   ============================================================ */

.seam {
  grid-column: 1;
  grid-row: 1;
  align-self: start;
  justify-self: start;
  inline-size: min(34vw, 22rem);
  block-size: var(--rule-hair);
  background: var(--color-rule);
  transform-origin: 0 50%;
  transform: scaleX(0.34);
}

/* ============================================================
   Motion system 2 · drift
   The haze. Three multiply layers + one screen-blend light + grain.
   Amplitudes are 2–5%: it should read as breathing, not floating.
   ============================================================ */

.haze {
  position: absolute;
  inset: 0;
  z-index: var(--z-base);
  pointer-events: none;
}

.haze__l,
.haze__glow,
.haze__grain {
  position: absolute;
  display: block;
  border-radius: 50%;
}

.haze__l { mix-blend-mode: multiply; }

/* The three layers are deliberately off-register and differently shaped —
   one broad, one small and low, one stretched horizontal — so the composite
   silhouette is a bank of mist, not a concentric blob. */
.haze__l--a {
  inset-block-start: 8%;   inset-inline-start: 24%;
  inline-size: min(68vw, 54rem); aspect-ratio: 1.28;
  background: radial-gradient(closest-side,
    color-mix(in oklch, var(--color-paper-3) 62%, transparent), transparent 78%);
  filter: blur(72px);
}
.haze__l--b {
  inset-block-start: 40%;  inset-inline-start: 52%;
  inline-size: min(30vw, 23rem); aspect-ratio: 0.9;
  background: radial-gradient(closest-side,
    color-mix(in oklch, var(--color-neutral) 12%, transparent), transparent 76%);
  filter: blur(84px);
}
.haze__l--c {
  inset-block-start: 26%;  inset-inline-start: 30%;
  inline-size: min(46vw, 36rem); aspect-ratio: 2.1;   /* a streak, not a circle */
  background: radial-gradient(closest-side,
    color-mix(in oklch, var(--color-paper-3) 46%, transparent), transparent 76%);
  filter: blur(58px);
}

/* 微光 — screen blend, so it only shows where the haze is thick.
   Light you can find inside the mist, not light applied on top of it. */
.haze__glow {
  inset-block-start: 24%;  inset-inline-start: 44%;
  inline-size: min(24vw, 19rem); aspect-ratio: 1.15;
  background: radial-gradient(closest-side, var(--color-glow), transparent 72%);
  filter: blur(44px);
  mix-blend-mode: screen;
  opacity: 1;
}

/* Grain covers the whole field, not just the haze. Two jobs, both load-bearing:
   it is the paper's tooth (颗粒), and it dithers the 8-bit banding that
   large-radius blur on a near-flat gradient otherwise leaves as onion rings. */
.haze__grain {
  inset: 0;
  inline-size: auto;
  border-radius: 0;
  filter: url(#grain);
  mix-blend-mode: multiply;
  opacity: 0.058;
}

@keyframes drift-a { to { transform: translate3d(-6.5%, 4.5%, 0) scale(1.12); } }
@keyframes drift-b { to { transform: translate3d(8.5%, -6%, 0)   scale(0.86); } }
@keyframes drift-c { to { transform: translate3d(-5%, -7.5%, 0)  scale(1.16); } }
@keyframes seam-grow { to { transform: scaleX(1); } }
@keyframes breathe   { to { opacity: 0.72; } }

.haze__l--a  { animation: drift-a var(--dur-drift-a) var(--ease-in-out) infinite alternate; }
.haze__l--b  { animation: drift-b var(--dur-drift-b) var(--ease-in-out) infinite alternate; }
.haze__l--c,
.haze__glow  { animation: drift-c var(--dur-drift-c) var(--ease-in-out) infinite alternate; }
.seam        { animation: emerge 500ms var(--ease-out) both,
                          seam-grow var(--dur-grow) var(--ease-in-out) infinite alternate; }

/* ============================================================
   Motion system 3 · swarm
   The name, come apart. Tiny pixel lights and single letters of
   "Light on Light" adrift over the haze — bouncing, flickering,
   gathering, dispersing. The wordmark at the bottom is where they
   have settled; that is what keeps this from being decoration.

   Every element is generated in JS with randomised position,
   travel, scale, opacity, blur, and FOUR independent periods —
   so no two loads are alike and the composite never repeats.
   Each nesting level animates exactly one property, which is why
   there are three of them: drift / bob / flicker can't collide.
   ============================================================ */

.swarm {
  position: absolute;
  inset: 0;
  z-index: var(--z-base);
  pointer-events: none;
  overflow: clip;
}

.mote {
  position: absolute;
  inset-inline-start: var(--x);
  inset-block-start: var(--y);
  animation: mote-drift var(--t1) var(--ease-in-out) var(--d1) infinite alternate;
}
.mote__b {
  display: block;
  animation: mote-bob var(--t2) var(--e2, var(--ease-in-out)) var(--d2) infinite alternate;
}
.mote__d {
  display: block;
  opacity: 0;
  animation: mote-flick var(--t3) var(--ease-in-out) var(--d3) infinite alternate;
}

/* pixel light — a square. Pixels have corners; that is the point. */
.mote--px .mote__d {
  inline-size: var(--s);
  block-size: var(--s);
  background: var(--c);
}

/* text fragment — one letter of the name, loose from it.
   Varying blur reads as depth, the way the reference stages its letters. */
.mote--ch .mote__d {
  font-family: var(--font-wordmark);
  font-size: var(--s);
  line-height: 1;
  color: var(--c);
  filter: blur(var(--bl));
}

/* 2D transforms on purpose: animating `transform` is compositor-driven either
   way, and translate3d would force a layer per nesting level — ~120 layers for
   a field this size. This halves that for free. */
@keyframes mote-drift { to { transform: translate(var(--dx), var(--dy)); } }
@keyframes mote-bob   { to { transform: translate(0, var(--by)) scale(var(--bs)); } }
/* --o0 is the floor. Most motes pulse down to it and hold; a third are dealt
   --o0: 0 and disappear completely before returning. */
@keyframes mote-flick { from { opacity: var(--o0); } to { opacity: var(--o); } }

/* ============================================================
   The wordmark — the page's only text of consequence,
   and its only entrance.
   ============================================================ */

.mark {
  grid-column: 1 / -1;
  grid-row: 3;
  justify-self: start;
  align-self: end;
  z-index: var(--z-raised);
  margin-inline-start: clamp(0rem, 8vw, var(--space-4xl));
  margin-block-end: clamp(var(--space-xl), 14vh, var(--space-3xl));
  line-height: 1;
}

.mark__link {
  position: relative;
  display: inline-block;
  font-family: var(--font-wordmark);
  font-weight: 400;
  font-size: var(--text-wordmark);
  letter-spacing: -0.005em;
  line-height: 1.06;
  color: var(--color-ink);
  text-decoration: none;
  white-space: nowrap;
  padding-block: var(--space-sm) var(--space-xs);
  /* Motion system 3 · mark — the name itself breathes, very slightly. */
  animation: breathe var(--dur-breath) var(--ease-in-out) infinite alternate;
}

/* A permanent, almost-invisible underline so the page's one link is
   findable without shouting. Hover fills it in over 1.6s — weather, not UI.
   ONE hover signal only: the rule draws. The type itself does not move,
   scale, or change colour. */
.mark__link::after {
  content: "";
  position: absolute;
  inset-block-end: 0;
  inset-inline-start: 0;
  inline-size: 100%;
  block-size: var(--rule-hair);
  background: var(--color-accent);
  opacity: 0.22;
  transform: scaleX(0.42);
  transform-origin: 0 50%;
  transition:
    transform var(--dur-slow) var(--ease-in-out),
    opacity   var(--dur-slow) var(--ease-in-out);
}

.mark__link:hover::after,
.mark__link:focus-visible::after { opacity: 0.9; transform: scaleX(1); }

/* Press. The one place this page is allowed to be quick. */
.mark__link:active::after {
  opacity: 1;
  transition-duration: var(--dur-micro);
}

/* Focus is instant and never animated. */
.mark__link:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 8px;
}

/* ============================================================
   The stamp — one micro-mark in the opposite corner.
   The reference parks "Loading… / 00" here; this parks the layer.
   ============================================================ */

.stamp {
  grid-column: 2;
  grid-row: 1;
  justify-self: end;
  align-self: start;
  margin-block-start: -0.5em;   /* optically align the cap-height to the seam */
  z-index: var(--z-raised);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: 0.24em;
  color: var(--color-muted);
  white-space: nowrap;
}

/* ============================================================
   ≤ 40rem — the haze recomposes for a tall, narrow field.
   Loops stay (they are the page), amplitudes drop further.
   ============================================================ */

@media (max-width: 40rem) {
  /* Denser and tighter on a tall narrow field — at 375px the desktop
     proportions wash out to nothing. */
  .haze__l--a {
    inset-block-start: 14%; inset-inline-start: 2%;
    inline-size: 96vw; aspect-ratio: 1.05;
    background: radial-gradient(closest-side,
      color-mix(in oklch, var(--color-paper-3) 78%, transparent), transparent 78%);
    filter: blur(52px);
  }
  .haze__l--b {
    inset-block-start: 34%; inset-inline-start: 40%;
    inline-size: 56vw; filter: blur(56px);
    background: radial-gradient(closest-side,
      color-mix(in oklch, var(--color-neutral) 16%, transparent), transparent 76%);
  }
  .haze__l--c {
    inset-block-start: 26%; inset-inline-start: 6%;
    inline-size: 78vw; aspect-ratio: 1.7; filter: blur(44px);
    background: radial-gradient(closest-side,
      color-mix(in oklch, var(--color-paper-3) 56%, transparent), transparent 76%);
  }
  .haze__glow {
    inset-block-start: 26%; inset-inline-start: 30%;
    inline-size: 46vw; filter: blur(34px);
  }

  .seam { inline-size: 40vw; }
  .mark { margin-block-end: clamp(var(--space-xl), 12vh, var(--space-3xl)); }
}

/* ============================================================
   Reduced motion — the page settles and stays settled.
   No emergence, no drift, no breath. Everything simply present.
   ============================================================ */

@media (prefers-reduced-motion: reduce) {
  .haze, .swarm, .seam, .mark, .stamp, .mark__link,
  .haze__l, .haze__glow,
  .mote, .mote__b, .mote__d {
    animation: none !important;
    opacity: 1;
  }
  /* The swarm stops moving but stays scattered — the composition survives,
     the motion doesn't. Each mote holds the opacity it was dealt. */
  .mote__d { opacity: var(--o); }
  .seam { transform: scaleX(0.72); }   /* the seam rests part-drawn */
  .mark__link::after { transition: none; }
}

/* Touch has no hover — the underline sits part-drawn so it still reads
   as a link, without becoming the loudest thing on a very quiet page. */
@media (pointer: coarse) {
  .mark__link::after { opacity: 0.34; transform: scaleX(0.66); }
}

</style>
</head>
<body>

<!-- Grain source. Generated, desaturated, and multiplied over the whole field. -->
<svg class="filters" aria-hidden="true" focusable="false" width="0" height="0">
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
</svg>

<main class="field">

  <!-- The seam: LAYER 01's own progress. It grows, recedes, and never
       completes, because the layer isn't finished forming. -->
  <span class="seam" aria-hidden="true"></span>

  <!-- The ground: 透明层叠 — three multiply layers, one screen-blend light,
       one grain. The mass with weight. -->
  <div class="haze" aria-hidden="true">
    <span class="haze__l haze__l--a"></span>
    <span class="haze__l haze__l--b"></span>
    <span class="haze__l haze__l--c"></span>
    <span class="haze__glow"></span>
    <span class="haze__grain"></span>
  </div>

  <!-- The name, come apart. Populated by the generator below. -->
  <div class="swarm" aria-hidden="true"></div>

  <h1 class="mark">
    <a class="mark__link" href="./concept.html">Light on Light</a>
  </h1>

  <p class="stamp" aria-hidden="true">LAYER 01</p>

</main>

<script>
/* ------------------------------------------------------------
   The swarm generator.
   Builds the field of pixel lights and loose letters, dealing every
   element its own position, travel, size, opacity, blur, and four
   independent periods. Negative delays start each one mid-cycle, so
   nothing is ever in step. Runs once at load; after that the whole
   thing is CSS — no rAF loop, no scroll listener, no per-frame JS.
   ------------------------------------------------------------ */
(function () {
  var field = document.querySelector('.swarm');
  if (!field) return;

  var R      = function (a, b) { return a + Math.random() * (b - a); };
  var chance = function (p) { return Math.random() < p; };
  var clamp  = function (v, lo, hi) { return Math.max(lo, Math.min(hi, v)); };

  /* Density follows viewport AREA, not a phone/desktop switch — a 1440 window
     and a 1920 window shouldn't get the same handful of motes. Decided once,
     at load: regenerating on resize would visibly reshuffle the field. */
  var area     = window.innerWidth * window.innerHeight;
  var PX_COUNT = Math.round(clamp(area / 15000,  24, 72));
  var CH_COUNT = Math.round(clamp(area / 105000,  5, 13));
  /* The name, come apart. Repeats weight the commoner letters. */
  var LETTERS  = ['l', 'i', 'g', 'h', 't', 'o', 'n', 'L', 'g', 'h', 't'];

  function mote(kind) {
    var m = document.createElement('span');
    var b = document.createElement('span');
    var d = document.createElement('span');
    m.className = 'mote mote--' + kind;
    b.className = 'mote__b';
    d.className = 'mote__d';
    b.appendChild(d);
    m.appendChild(b);

    /* Custom properties inherit, so everything is set once, on the outer
       node, and the three animating levels each read what they need. */
    var set = function (k, v) { m.style.setProperty(k, v); };

    /* drift — the long wander that gathers and disperses the field */
    set('--x',  R(-6, 102).toFixed(2) + '%');
    set('--y',  R(-6, 98).toFixed(2)  + '%');
    set('--dx', R(-16, 16).toFixed(1) + 'vw');
    set('--dy', R(-13, 13).toFixed(1) + 'vh');
    set('--t1', R(15, 34).toFixed(1)   + 's');
    set('--d1', (-R(0, 34)).toFixed(1) + 's');

    /* bob — the bounce and swell riding on top of the drift. A third get a
       short, snappy toss (--ease-out, reversed by `alternate`, so it throws
       and falls); the rest just swell. */
    var springy = chance(0.34);
    set('--by', R(-3.4, 3.4).toFixed(2) + 'vh');
    set('--bs', R(0.58, 1.55).toFixed(2));
    set('--t2', (springy ? R(1.1, 3) : R(3, 7.5)).toFixed(2) + 's');
    set('--d2', (-R(0, 7.5)).toFixed(2) + 's');
    if (springy) m.style.setProperty('--e2', 'var(--ease-out)');

    /* Two thirds pulse without ever leaving — they hold a floor. One third
       goes all the way to nothing and comes back, the way the reference
       empties its field. Without the floor EVERY mote would sit near zero
       half the time, which halves the density you actually perceive. */
    var vanishes = chance(0.34);

    if (kind === 'px') {
      /* One in seven is a light; the rest are dust. Lights are SMALL and
         bright — a point, not a block. Dust may be larger and duller. An
         amber square big enough to read as a shape stops being light and
         starts looking like a UI error, which is what the first pass did. */
      var lit = chance(0.15);
      set('--c', lit ? 'var(--color-accent)'
                     : (chance(0.5) ? 'var(--color-ink-2)' : 'var(--color-neutral)'));
      set('--s', (lit ? R(1.5, 3.4) : R(2, 6.5)).toFixed(2) + 'px');
      var o = lit ? R(0.45, 0.78) : R(0.18, 0.52);
      set('--o', o.toFixed(3));
      set('--o0', (vanishes ? 0 : o * R(0.3, 0.58)).toFixed(3));
      /* A third twinkle fast, the rest breathe. The 0.9s floor is per
         iteration, and `alternate` means a full on-off cycle is 1.8s —
         about 0.55 Hz, well under the 3 Hz photosensitivity threshold.
         That threshold is the one thing this effect must not cross. */
      var fast = chance(0.36);
      set('--t3', (fast ? R(0.9, 2.4) : R(3.2, 9)).toFixed(2) + 's');
      set('--d3', (-R(0, 9)).toFixed(2) + 's');
    } else {
      set('--c', chance(0.2) ? 'var(--color-accent)' : 'var(--color-ink)');
      set('--s',  R(1.2, 5).toFixed(2)   + 'rem');
      var lo = R(0.09, 0.26);
      set('--o',  lo.toFixed(3));
      set('--o0', (vanishes ? 0 : lo * R(0.25, 0.5)).toFixed(3));
      set('--bl', R(0, 2.6).toFixed(2)   + 'px');   /* blur reads as depth */
      set('--t3', R(4.5, 12).toFixed(2)  + 's');
      set('--d3', (-R(0, 12)).toFixed(2) + 's');
      d.textContent = LETTERS[Math.floor(Math.random() * LETTERS.length)];
    }
    return m;
  }

  var frag = document.createDocumentFragment();
  var i;
  for (i = 0; i < PX_COUNT; i++) frag.appendChild(mote('px'));
  for (i = 0; i < CH_COUNT; i++) frag.appendChild(mote('ch'));
  field.appendChild(frag);
})();
</script>
</body>
</html>
